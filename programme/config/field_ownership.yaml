# ===================================================================
# Field ownership policy
# ===================================================================
# HUMAN  = controlled by named humans. Automation MUST NOT modify these.
# MACHINE = derived from repository evidence or calculated. Automation owns.
# SHARED  = seeded once by a human, then machine-maintained evidence attaches.
#
# Validation fails if automation attempts to write a HUMAN field.
# The workbook renders an ownership marker against every column so a
# reviewer can see who may change what.

default:
  # Anything not listed below is treated as human-controlled.
  unknown_field_policy: HUMAN

