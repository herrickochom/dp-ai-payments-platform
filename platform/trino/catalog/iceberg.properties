connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${env:NESSIE_TRINO_ENDPOINT}/iceberg
iceberg.rest-catalog.warehouse=${env:NESSIE_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.token=${env:NESSIE_TRINO_READ_TOKEN}
fs.native-s3.enabled=true
s3.endpoint=${env:S3_ENDPOINT}
s3.path-style-access=${env:S3_PATH_STYLE_ACCESS}
s3.aws-access-key=${env:TRINO_S3_ACCESS_KEY_ID}
s3.aws-secret-key=${env:TRINO_S3_SECRET_ACCESS_KEY}
s3.region=${env:OBJECT_STORE_REGION}
iceberg.file-format=PARQUET
