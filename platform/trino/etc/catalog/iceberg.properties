connector.name=iceberg
fs.native-s3.enabled=true
iceberg.catalog.type=rest
iceberg.rest-catalog.security=NONE
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/
iceberg.rest-catalog.vended-credentials-enabled=false
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
# F9: the S3 credential is supplied by the environment. A literal secret was
# previously committed here, which exposed the catalog principal to anyone with
# repository read access.
s3.aws-access-key=${ENV:NESSIE_CATALOG_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:NESSIE_CATALOG_S3_SECRET_KEY}

