coordinator=true
node-scheduler.include-coordinator=true

http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/trino-keystore.jks
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}

http-server.authentication.type=PASSWORD
# F5/F7: authentication is REQUIRED before authorisation. The previous
# 'true' let any caller assert an arbitrary X-Trino-User over plaintext
# HTTP and inherit that identity's file-based ACL grants.
http-server.authentication.allow-insecure-over-http=false
http-server.authentication.password.user-mapping.pattern=(.*)
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}

query.max-memory=400MB
query.max-memory-per-node=300MB

discovery.uri=http://${ENV:TRINO_HOST}:8080
