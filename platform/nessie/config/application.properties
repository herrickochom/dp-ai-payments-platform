# Nessie 0.104 uses the JDBC2 store and a named Quarkus datasource.
nessie.version.store.type=JDBC2
nessie.version.store.persist.jdbc.datasource=postgresql
quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://postgres:5432/postgres
quarkus.datasource.postgresql.username=${POSTGRES_USER}
quarkus.datasource.postgresql.password=${POSTGRES_PASSWORD}

# Iceberg REST catalog backed by the MinIO warehouse.  DuckDB writes through
# this endpoint; Trino reads the same Nessie-managed Iceberg tables.
nessie.catalog.default-warehouse=payments
nessie.catalog.warehouses.payments.location=s3://dp-ai-payment/warehouse/
nessie.catalog.service.s3.default-options.region=eu-west-1
nessie.catalog.service.s3.default-options.endpoint=http://minio:9000
nessie.catalog.service.s3.default-options.path-style-access=true
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:minio-credentials
minio-credentials.name=${MINIO_ROOT_USER}
minio-credentials.secret=${MINIO_ROOT_PASSWORD}
