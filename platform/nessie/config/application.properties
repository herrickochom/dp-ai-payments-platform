# -----------------------------------------------------------------------------
# Nessie persistence
# -----------------------------------------------------------------------------
# Nessie 0.104 uses the JDBC2 version store backed by PostgreSQL.

nessie.version.store.type=JDBC2
nessie.version.store.persist.jdbc.datasource=postgresql

quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
quarkus.datasource.postgresql.username=${POSTGRES_USER}
quarkus.datasource.postgresql.password=${POSTGRES_PASSWORD}


# -----------------------------------------------------------------------------
# Iceberg REST catalog
# -----------------------------------------------------------------------------
# The physical Iceberg warehouse is independent of the Nessie reference.
#
# Physical warehouse:
#   s3://dp-ai-payment/warehouse
#
# Nessie references such as:
#   main
#   transform_<run>
#
# select metadata versions of the same warehouse. They are not physical
# directories beneath the warehouse.

nessie.catalog.default-warehouse=payments

# Named warehouse retained for clients that explicitly request "payments".
nessie.catalog.warehouses.payments.location=${WAREHOUSE_URI}


# -----------------------------------------------------------------------------
# S3 / MinIO object storage
# -----------------------------------------------------------------------------

nessie.catalog.service.s3.default-options.region=${OBJECT_STORE_REGION}
nessie.catalog.service.s3.default-options.endpoint=${S3_ENDPOINT}
nessie.catalog.service.s3.default-options.path-style-access=${S3_PATH_STYLE_ACCESS}

# Nessie resolves the credentials through its Quarkus secret configuration.
nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie-s3-default
nessie.catalog.service.s3.default-options.auth-type=${NESSIE_S3_AUTH_TYPE}

nessie-s3-default.name=${NESSIE_S3_ACCESS_KEY}
nessie-s3-default.secret=${NESSIE_S3_SECRET_KEY}