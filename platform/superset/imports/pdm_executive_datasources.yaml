# Curated BI datasource manifest (F2/F3).
#
# BI Trino identity is the canonical service account; credentials live in
# password.db / the secret provider and are NEVER embedded here.
# SQL Lab is disabled on this controlled connection (F3-2).
#
# Identity-bearing consumption datasets are DENY BY DEFAULT for BI and are
# excluded below. Their data and dbt models are unchanged.
#   excluded: cns_pdm_ai_default_risk
#   excluded: cns_pdm_beneficiary_identity_alerts
#   excluded: cns_pdm_beneficiary_insights
#   excluded: cns_pdm_end_to_end_traceability
#   excluded: cns_pdm_loan_intervention_dashboard
#   excluded: cns_pdm_payment_operations

# removed as BI-approved: ['cns_pdm_beneficiary_insights', 'cns_pdm_loan_intervention_dashboard']
databases:
- database_name: PDM Lakehouse
  sqlalchemy_uri: trino://superset_bi@trino:8080/iceberg/consumption
  expose_in_sqllab: false
  allow_ctas: false
  allow_cvas: false
  allow_dml: false
  tables:
  - table_name: cns_pdm_district_geographic_risk
    schema: consumption
  - table_name: cns_pdm_executive_monthly_trend
    schema: consumption
  - table_name: cns_pdm_executive_overview
    schema: consumption
  - table_name: cns_pdm_financial_fund_flow
    schema: consumption
  - table_name: cns_pdm_fraud_risk_insights
    schema: consumption
  - table_name: cns_pdm_fund_flow_funnel
    schema: consumption
  - table_name: cns_pdm_geographic_alerts
    schema: consumption
  - table_name: cns_pdm_geographic_coverage
    schema: consumption
  - table_name: cns_pdm_geographic_risk_drivers
    schema: consumption
  - table_name: cns_pdm_geographic_risk_summary
    schema: consumption
  - table_name: cns_pdm_geographic_risk_trend
    schema: consumption
  - table_name: cns_pdm_lifecycle_exceptions
    schema: consumption
  - table_name: cns_pdm_local_government_performance
    schema: consumption
  - table_name: cns_pdm_parish_geographic_risk
    schema: consumption
