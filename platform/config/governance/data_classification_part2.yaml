layers:
  raw: {access: replay-audit-only, bi_access: false, log_protected_values: false}
  staging: {access: restricted-parsing-only, bi_access: false, log_protected_values: false}
  bronze: {access: controlled-operational, bi_access: false, clear_pii: convenience-prohibited}
  silver: {access: analytical-privacy-boundary, clear_identity: vault-only}
  gold: {access: business-ready-aggregated, direct_identifiers: prohibited}
  consumption: {access: non-identifying-aggregated, beneficiary_identity: vault-path-only}
tokenisation_standard:
  algorithm: HMAC-SHA256
  key_env: DP_TOKEN_KEY
  key_version_env: DP_TOKEN_KEY_VERSION
  banned: [plain-sha256-of-identifier, unsalted-hash]
  properties: [deterministic, join-stable, key-version-recorded, rotation-documented]
  missing_key: fail-closed
restricted_identity:
  design: TOKEN -> controlled-identity-resolver -> clear-identity
  ordinary_paths_must_not_reverse_tokens: true
  authorisation_required: true
  auditing_required: true
