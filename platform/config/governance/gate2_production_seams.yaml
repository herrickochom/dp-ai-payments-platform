TRINO_HTTP_SCHEME_PROD: https
TRINO_TLS_KEYSTORE: ${TRINO_KEYSTORE_PASSWORD:-}
KMS_KEY_ID: ${KMS_KEY_ID:-}
SECRET_MANAGER: ${SECRET_MANAGER:-unset}
CREDENTIAL_ROTATION: documented-manual-until-KMS-lands
