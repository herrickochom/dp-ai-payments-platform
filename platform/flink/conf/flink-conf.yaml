###############################################################################
# Apache Flink — Day-0 session-cluster configuration
#
# Scope: STR-002B / B1 (streaming-route substrate infrastructure).
#
# This file configures a two-container Flink session cluster
# (flink-jobmanager + flink-taskmanager) on the Compose network
# `data-platform-network`.
#
# It does NOT configure topic names, schema subjects, canonical lifecycle
# keys, or job-specific contracts. Those are STR-002B / B2 (contract-bound),
# and STR-003 onward.
#
# No secret values appear in this file. Credentials for MinIO checkpoints
# are supplied at runtime by Compose environment variables, or by the shared
# secret provider.
#
# Configuration delivery note:
#   This file is mounted into the containers from the host. The Flink
#   entrypoint rewrites flink-conf.yaml with sed -i at startup, which means
#   the mount must be writable — a read-only mount causes the entrypoint to
#   fail silently and FLINK_PROPERTIES is not merged into the effective
#   configuration. Any setting that must take effect belongs in this file.
#   Environment-derived values that cannot be static here should be
#   delivered through a mechanism other than FLINK_PROPERTIES, or the mount
#   should be made writable.
#
# Conventions follow platform/trino/etc/config.properties:
#   - Commented sections
#   - Non-default settings explained inline
#   - Values that must be supplied at runtime reference an env var name
###############################################################################

# -----------------------------------------------------------------------------
# Cluster identity and RPC
# -----------------------------------------------------------------------------
# These values are stable for the Day-0 single-node topology on the Compose
# network. Changing them requires a coordinated update in docker-compose.yaml.
#
# jobmanager.rpc.address is the hostname the TASKMANAGER uses to find the
# RESOURCE MANAGER, which runs inside the JobManager container. It must be
# `flink-jobmanager`, never `flink-taskmanager`. If this value points at the
# TaskManager hostname, the TaskManager will try to register itself with
# itself, hit a RegistrationTimeoutException after 5 minutes, and terminate.
# The JobManager will then have zero TaskManagers and any submitted job will
# fail with NoResourceAvailableException.
#
# The hostname `flink-jobmanager` resolves on the Compose network via the
# `hostname:` field on the flink-jobmanager service in docker-compose.yaml.
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123

jobmanager.bind-host: 0.0.0.0
taskmanager.bind-host: 0.0.0.0
taskmanager.host: flink-taskmanager

# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
# Day-0 development defaults. Non-functional sizing requirements for
# production are tracked as risk U12 in docs/streaming/risk-register.md and
# must be supplied by the platform operations owner before production use.
jobmanager.memory.process.size: 1024m
taskmanager.memory.process.size: 2048m

# -----------------------------------------------------------------------------
# Task slots
# -----------------------------------------------------------------------------
# 2 slots per TaskManager is a deliberate Day-0 default: enough to run the
# skeleton job alongside a stateful stream job without oversubscribing the
# container. Parallelism per job is bounded by this value until the topology
# is scaled.
taskmanager.numberOfTaskSlots: 2

# -----------------------------------------------------------------------------
# State backend
# -----------------------------------------------------------------------------
# RocksDB is chosen per the ADR and the phased plan: lifecycle keyed state
# can outgrow memory, and RocksDB persists to disk between checkpoints.
state.backend: rocksdb
state.backend.incremental: true

# -----------------------------------------------------------------------------
# Checkpoints
# -----------------------------------------------------------------------------
# Storage is MinIO via the S3 filesystem plugin, using a dedicated prefix
# under the existing object store. This is NOT under raw/ or warehouse/.
#
# state.checkpoints.dir and state.savepoints.dir are static for the Day-0
# Compose stack. They were previously delivered through FLINK_PROPERTIES,
# but that mechanism does not merge into a read-only mounted conf file, so
# the values are declared here and the FLINK_PROPERTIES block in
# docker-compose.yaml no longer carries them.
#
# The bucket name is dp-ai-payment. If the bucket is ever renamed, this
# file and docker-compose.yaml must be updated together.
execution.checkpointing.mode: EXACTLY_ONCE
# Day-0 interval. Production intervals are a sizing decision tracked under
# U12 and STR-003.
execution.checkpointing.interval: 30s
execution.checkpointing.min-pause: 10s
execution.checkpointing.timeout: 10min
execution.checkpointing.max-concurrent-checkpoints: 1
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

state.checkpoints.dir: s3://dp-ai-payment/flink/checkpoints
state.savepoints.dir: s3://dp-ai-payment/flink/savepoints

# -----------------------------------------------------------------------------
# Restart strategy
# -----------------------------------------------------------------------------
# Fixed-delay restart for Day-0. Production strategy is a STR-003 decision.
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 5
restart-strategy.fixed-delay.delay: 10s

# -----------------------------------------------------------------------------
# Metrics — Prometheus reporter
# -----------------------------------------------------------------------------
# The Flink Prometheus reporter exposes a scrape endpoint on the
# TaskManager. Prometheus itself is deployed in STR-008; the reporter is
# enabled here so that STR-002B/B1 already emits metrics, per cross-cutting
# workstream WS-2 in the phased plan.
metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
metrics.reporter.prom.port: 9249

# -----------------------------------------------------------------------------
# S3 filesystem (for checkpoint storage)
# -----------------------------------------------------------------------------
# The S3 plugin is bundled into the image by Dockerfile.flink.
#
# s3.endpoint is REQUIRED. Without it, the Hadoop S3A client defaults to
# https://s3.amazonaws.com and every S3 request fails with 403 Forbidden,
# because the MinIO-issued credentials are unknown to AWS. The failure
# surfaces during JobMaster initialization as an AccessDeniedException on
# getFileStatus for the savepoint path.
#
# The endpoint is static for the Day-0 Compose stack. It is declared here
# rather than in FLINK_PROPERTIES because the entrypoint does not merge
# environment-supplied settings into a read-only mounted conf file.
#
# s3.path.style.access is required for MinIO. s3.connection.* tune the
# underlying HTTP client.
s3.endpoint: http://minio:9000
s3.path.style.access: true
s3.connection.maximum: 50
s3.connection.timeout: 60000
s3.connection.request.timeout: 60000

# S3A committer configuration.
#
# The default S3A committer performs a bulk delete of the parent prefix
# after every checkpoint or savepoint commit. The flink-checkpoint MinIO
# identity is scoped to flink/checkpoints/* and flink/savepoints/* (see
# platform/minio/policies/flink-checkpoint.json) and does not grant delete
# on the parent flink/ prefix. The bulk delete is therefore denied with
# AccessDenied, and the denial blocks the task's checkpoint listener. On a
# session cluster with a single TaskManager, the stalled checkpoint loop
# also stalls the Kafka consumer in the same task, which then disconnects
# from the broker and never reconnects.
#
# The directory committer does not perform the parent-prefix bulk delete.
# It stages each task's output in a task-specific directory and renames on
# commit. Both operations stay within the granted prefix scope, so the
# checkpoint commits without the AccessDenied warning.
#
# Do NOT change this to the magic or file committer without also widening
# the flink-checkpoint policy to include the flink/ parent prefix and the
# s3:DeleteObjectVersion, s3:AbortMultipartUpload, and
# s3:ListMultipartUploadParts actions. The provisioning script
# (platform/minio/provision_object_store_identities.py) enforces the
# narrower scope and will reject a policy that includes those actions.
fs.s3a.committer.name: directory
fs.s3a.committer.staging.conflict-mode: append
fs.s3a.committer.staging.unique-filenames: true

# Access keys are supplied via the standard AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY environment variables provided by Compose, using a
# dedicated least-privilege identity. They are NOT written to this file.

# -----------------------------------------------------------------------------
# Web UI
# -----------------------------------------------------------------------------
# The JobManager web UI is published by Compose to a loopback-only host port.
# This file only configures the in-container bind.
jobmanager.web.address: 0.0.0.0
jobmanager.web.port: 8081

# -----------------------------------------------------------------------------
# Class loading
# -----------------------------------------------------------------------------
# Child-first class loading is the Flink default. It is set explicitly so
# that connector dependencies do not collide with the Flink distribution.
classloader.resolve-order: child-first

env.java.opts.all: --add-opens java.base/java.net=ALL-UNNAMED
env.java.opts.client: --add-opens java.base/java.net=ALL-UNNAMED