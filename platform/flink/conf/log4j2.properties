###############################################################################
# Apache Flink — log configuration
#
# Scope: STR-002B / B1.
#
# Flink 1.18+ uses log4j2. This file follows Flink's stock layout: INFO to
# stdout/stderr (captured by Docker), and WARN to a file inside the container.
# No central log shipper is configured here.
###############################################################################

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.console.filter.threshold.type = ThresholdFilter
rootLogger.appenderRef.console.filter.threshold.level = INFO

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

appender.file.name = FileAppender
appender.file.type = FILE
appender.file.fileName = ${sys:log.file}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = WARN
rootLogger.appenderRef.file.ref = FileAppender

logger.akka.name = akka
logger.akka.level = INFO
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = ERROR
logger.netty.name = org.apache.flink.shaded.netty4
logger.netty.level = WARN
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN
