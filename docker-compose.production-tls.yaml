services:
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094,EXTERNAL_SASL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094},EXTERNAL_SASL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_SASL_PORT:-9095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,EXTERNAL_SASL:SSL
      KAFKA_SSL_KEYSTORE_LOCATION: ${KAFKA_SSL_KEYSTORE_LOCATION:-/etc/kafka/certs/kafka.keystore.jks}
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD:-}
      KAFKA_SSL_TRUSTSTORE_LOCATION: ${KAFKA_SSL_TRUSTSTORE_LOCATION:-/etc/kafka/certs/kafka.truststore.jks}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:-}
      KAFKA_SSL_CLIENT_AUTH: ${KAFKA_SSL_CLIENT_AUTH:-none}
      KAFKA_SASL_MECHANISM_INTER_BROKER: ${KAFKA_SASL_MECHANISM_INTER_BROKER:-}
      KAFKA_OPTS: ${KAFKA_OPTS:-}
    ports:
      - ${KAFKA_SASL_PORT:-9095}:9095
    volumes:
      - ${KAFKA_CERT_DIR:-/etc/kafka/certs}:/etc/kafka/certs:ro

  schema-registry:
    environment:
      SCHEMA_REGISTRY_LISTENERS: ${SCHEMA_REGISTRY_LISTENERS:-http://0.0.0.0:8081}
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: ${SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS:-PLAINTEXT://kafka:9092}
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: ${SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL:-PLAINTEXT}
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: ${SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM:-}
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: ${SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG:-}
      SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION: ${SCHEMA_REGISTRY_SSL_KEYSTORE_LOCATION:-/etc/schema-registry/certs/sr.keystore.jks}
      SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD: ${SCHEMA_REGISTRY_SSL_KEYSTORE_PASSWORD:-}
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION: ${SCHEMA_REGISTRY_SSL_TRUSTSTORE_LOCATION:-/etc/schema-registry/certs/sr.truststore.jks}
      SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD: ${SCHEMA_REGISTRY_SSL_TRUSTSTORE_PASSWORD:-}
    ports:
      - ${SCHEMA_REGISTRY_HTTPS_PORT:-8082}:8082
    volumes:
      - ${SCHEMA_REGISTRY_CERT_DIR:-/etc/schema-registry/certs}:/etc/schema-registry/certs:ro
