name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          zero="0000000000000000000000000000000000000000"

          if [[ -z "$base" || "$base" == "$zero" ]]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            else
              git diff-tree --check --root HEAD
              exit 0
            fi
          fi

          git diff --check "$base" HEAD


  terraform-governance:
    name: Terraform governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate -no-color

      - name: Terraform governance tests
        run: python -m pytest -q tests/terraform


  cdc-mdm-regression:
    name: CDC and MDM regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: CDC and MDM regression tests
        run: python -m pytest -q tests/cdc tests/mdm

      - name: Orchestration regression tests
        run: python -m pytest -q orchestration/airflow/tests


  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Compose configuration
        run: docker compose config --quiet
