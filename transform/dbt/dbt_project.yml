# GCP repository: transform/dbt/dbt_project.yml

name: "pdm_platform"
version: "1.0.0"
config-version: 2

profile: "pdm_platform"

# ------------------------------------------------------------------------------
# Project paths
# ------------------------------------------------------------------------------

model-paths:
  - "models"

analysis-paths:
  - "analyses"

test-paths:
  - "tests"

seed-paths:
  - "seeds"

macro-paths:
  - "macros"

snapshot-paths:
  - "snapshots"

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ------------------------------------------------------------------------------
# Model configuration
#
# BigQuery relation hierarchy: project.dataset.table.
# The dbt model layers use their declared logical schemas:
#
#   staging
#   bronze
#   silver
#   silver_vault
#   gold
#   consumption
#
# Native BigLake Iceberg V2 publication is NOT provided by the default
# dbt-bigquery table materialization. Do not execute until Stage B is validated.
# ------------------------------------------------------------------------------

models:
  pdm_platform:
    +materialized: table

    staging:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: staging
      +materialized: view

    bronze:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: bronze
      +materialized: table

    silver:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: silver
      +materialized: table

    silver_vault:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: silver_vault
      +materialized: table

    gold:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: gold
      +materialized: table

    consumption:
      +database: "{{ env_var('DBT_GCP_PROJECT') }}"
      +schema: consumption
      +materialized: table

# ------------------------------------------------------------------------------
# Seed configuration
#
# Seeds are static reference tables materialized once per run branch.
# They are placed in `silver` because:
#
#   * The transform runtime provisions exactly the namespaces
#     {bronze, silver, silver_vault, gold, consumption} on the run branch.
#   * The profile's default schema is `staging`, which is a DuckDB-local
#     view namespace and is deliberately not provisioned on the run branch.
#   * The geographic reference seeds are read by consumption-layer models
#     that already depend on `silver`-level dimensions.
#
# A seed left without explicit configuration would fall back to the
# profile's default schema and fail with SCHEMA_NOT_FOUND before any
# model that references it could build.
# ------------------------------------------------------------------------------

seeds:
  pdm_platform:
    +database: "{{ env_var('DBT_GCP_PROJECT') }}"
    +schema: silver
    +quote_columns: false

# ------------------------------------------------------------------------------
# Project variables
# ------------------------------------------------------------------------------

vars:
  s3_bucket: "{{ env_var('OBJECT_STORE_BUCKET', 'dp-pdm-ai-platform-dev') }}"
  s3_path: "{{ env_var('RAW_ROOT', 'raw/v2') }}"
