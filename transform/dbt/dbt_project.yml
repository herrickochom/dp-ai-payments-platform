# /home/hochom/projects/dp-ai-payments-platform/transform/dbt/dbt_project.yml

name: "pdm_platform"
version: "1.0.0"
config-version: 2

profile: "pdm_platform"

# ------------------------------------------------------------------------------
# Project paths
# ------------------------------------------------------------------------------

model-paths:
  - "models"

analysis-paths:
  - "analyses"

test-paths:
  - "tests"

seed-paths:
  - "seeds"

macro-paths:
  - "macros"

snapshot-paths:
  - "snapshots"

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# ------------------------------------------------------------------------------
# Model configuration
#
# Trino relation hierarchy:
#
#   catalog.schema.table
#
# The catalog is "iceberg".
# The dbt model layers are Iceberg schemas:
#
#   staging
#   bronze
#   silver
#   silver_vault
#   gold
#   consumption
#
# The dedicated transform Trino instance owns the Nessie reference,
# physical warehouse and S3 configuration. dbt does not select or
# construct the Nessie branch directly.
# ------------------------------------------------------------------------------

models:
  pdm_platform:
    +materialized: table

    staging:
      +database: iceberg
      +schema: staging
      +materialized: view

    bronze:
      +database: iceberg
      +schema: bronze
      +materialized: table

    silver:
      +database: iceberg
      +schema: silver
      +materialized: table

    silver_vault:
      +database: iceberg
      +schema: silver_vault
      +materialized: table

    gold:
      +database: iceberg
      +schema: gold
      +materialized: table

    consumption:
      +database: iceberg
      +schema: consumption
      +materialized: table

# ------------------------------------------------------------------------------
# Seed configuration
#
# Seeds are static reference tables materialized once per run branch.
# They are placed in `silver` because:
#
#   * The transform runtime provisions exactly the namespaces
#     {bronze, silver, silver_vault, gold, consumption} on the run branch.
#   * The profile's default schema is `staging`, which is a DuckDB-local
#     view namespace and is deliberately not provisioned on the run branch.
#   * The geographic reference seeds are read by consumption-layer models
#     that already depend on `silver`-level dimensions.
#
# A seed left without explicit configuration would fall back to the
# profile's default schema and fail with SCHEMA_NOT_FOUND before any
# model that references it could build.
# ------------------------------------------------------------------------------

seeds:
  pdm_platform:
    +database: iceberg
    +schema: silver
    +quote_columns: false

# ------------------------------------------------------------------------------
# Project variables
# ------------------------------------------------------------------------------

vars:
  s3_bucket: "{{ env_var('OBJECT_STORE_BUCKET') }}"
  s3_path: "{{ env_var('RAW_ROOT') }}"
  iceberg_catalog: "{{ env_var('ICEBERG_CATALOG') }}"