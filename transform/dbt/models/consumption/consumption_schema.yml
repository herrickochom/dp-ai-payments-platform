version: 2

models:
  - name: cns_pdm_payments_daily_summary
    description: >
      Daily stakeholder payment metrics by source, currency,
      reconciliation and entity matching.
    config:
      meta:
        grain:
          - payment_date_sk
          - source_system
          - currency
        audience:
          - PDM leadership
          - PDM Secretariat
          - finance operations

  - name: cns_pdm_parish_performance
    description: >
      Parish-level PDM loan disbursement, outstanding balance
      and repayment performance.
    config:
      meta:
        grain:
          - region
          - district
          - parish
        audience:
          - PDM leadership
          - district leadership
          - parish officers

  - name: cns_pdm_agent_risk_indicators
    description: >
      Daily investigation-triage indicators for rapid cash-out,
      excess amount, reconciliation and agent identity concerns.
    config:
      meta:
        grain:
          - agent_sk
          - cashout_date_sk
        audience:
          - internal audit
          - IGG
          - investigators
    columns:
      - name: risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_beneficiary_insights
    description: >
      Beneficiary oversight view for multiple loans, verification,
      repayment and cash-out monitoring.
    config:
      meta:
        grain:
          - beneficiary_sk
        audience:
          - PDM Secretariat
          - district leadership
          - authorised investigators
    columns:
      - name: beneficiary_sk
        data_tests:
          - not_null
          - unique

      - name: oversight_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - STANDARD
                  - REVIEW

  - name: cns_pdm_beneficiary_identity_alerts
    description: >
      Authorised investigator view of shared identity, shared phone,
      multiple-loan and payment-account substitution indicators.
    config:
      meta:
        grain:
          - beneficiary_sk
        audience:
          - internal audit
          - IGG
          - authorised investigators
        classification: restricted
    columns:
      - name: beneficiary_sk
        data_tests:
          - not_null
          - unique

      - name: identity_risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_lifecycle_exceptions
    description: >
      Investigator control view tracing approved, instructed, status,
      settled, credited, cash-out and repaid stages with amount variances.
    config:
      meta:
        grain:
          - loan_id
        audience:
          - PDM Secretariat
          - internal audit
          - IGG
          - authorised investigators
    columns:
      - name: lifecycle_sk
        data_tests:
          - not_null
          - unique

      - name: intervention_priority
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_duplicate_fragmentation_alerts
    description: >
      Same-entitlement duplicate, cross-channel, repeated-amount
      and fragmented-payment indicators.
    config:
      meta:
        grain:
          - beneficiary_sk
          - loan_id
          - payment_date_sk
          - currency
        audience:
          - payment operations
          - internal audit
          - authorised investigators
    columns:
      - name: payment_pattern_sk
        data_tests:
          - not_null
          - unique

      - name: payment_pattern_risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_geographic_risk
    description: >
      Parish peer-comparison view combining disbursement, repayment
      and beneficiary identity indicators.
    config:
      meta:
        grain:
          - region
          - district
          - parish
        audience:
          - PDM leadership
          - PDM Secretariat
          - district leadership
    columns:
      - name: geographic_risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_executive_overview
    description: >
      Programme-wide leadership scorecard covering fund flow,
      repayment, reconciliation, exceptions and geographic risk.
    config:
      meta:
        grain:
          - programme_id
          - as_of_date
        audience:
          - PDM Executive
          - Government leadership
    columns:
      - name: programme_id
        data_tests:
          - not_null
          - unique

  - name: cns_pdm_loan_intervention_dashboard
    description: >
      Loan-level operational dashboard distinguishing normal progression
      from cases requiring intervention.
    config:
      meta:
        grain:
          - loan_id
        audience:
          - PDM Secretariat
    columns:
      - name: lifecycle_sk
        data_tests:
          - not_null
          - unique

      - name: intervention_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - PROGRESSING
                  - REQUIRES_INTERVENTION

  - name: cns_pdm_local_government_performance
    description: >
      Local-government presentation of parish portfolio performance
      and peer-relative risk.
    config:
      meta:
        grain:
          - region
          - district
          - parish
        audience:
          - district leadership
          - parish leadership
    columns:
      - name: parish_sk
        data_tests:
          - not_null
          - unique

      - name: local_performance_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ON_TRACK
                  - AT_RISK
                  - CRITICAL

  - name: cns_pdm_financial_fund_flow
    description: >
      Loan-level approved-to-repayment fund flow with adjacent-stage
      variances and explicit recovery observability.
    config:
      meta:
        grain:
          - loan_id
        audience:
          - Finance
          - Treasury
    columns:
      - name: lifecycle_sk
        data_tests:
          - not_null
          - unique

  - name: cns_pdm_fund_flow_funnel
    description: >
      Executive and operational fund-flow funnel dataset presenting
      approved, instructed, settled, credited and cash-out stages
      in ordered long-form structure for dashboard visualisation.
    config:
      meta:
        grain:
          - stage_order
          - stage
        audience:
          - Finance
          - Treasury
          - payment operations
          - PDM Secretariat
        category: operations
    columns:
      - name: stage_order
        data_tests:
          - not_null
          - unique

      - name: stage
        data_tests:
          - not_null
          - unique

      - name: amount
        data_tests:
          - not_null

  - name: cns_pdm_end_to_end_traceability
    description: >
      Restricted audit drill-through joining loan, beneficiary, SACCO
      and available payment identifiers across the lifecycle.
    config:
      meta:
        grain:
          - loan_id
        audience:
          - Audit
          - Internal Controls
        classification: restricted
    columns:
      - name: lifecycle_sk
        data_tests:
          - not_null
          - unique

  - name: cns_pdm_fraud_risk_insights
    description: >
      Loan-level investigation indicators composed from identity,
      payment-pattern, cash-out, lifecycle and geographic signals;
      not a fraud determination.
    config:
      meta:
        grain:
          - loan_id
        audience:
          - Fraud
          - Financial Crime
          - authorised investigators
        classification: restricted
    columns:
      - name: risk_case_sk
        data_tests:
          - not_null
          - unique

      - name: risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_payment_operations
    description: >
      Daily payment-channel operational performance, rejection,
      reconciliation and entity-matching metrics.
    config:
      meta:
        grain:
          - payment_date_sk
          - source_system
          - currency
        audience:
          - payment operations

  - name: cns_pdm_sacco_portfolio
    description: >
      SACCO-level exposure, disbursement, outstanding balance
      and repayment portfolio.
    config:
      meta:
        grain:
          - sacco_sk
        audience:
          - SACCO management
          - PDM Secretariat
    columns:
      - name: sacco_sk
        data_tests:
          - not_null
          - unique

  - name: cns_pdm_channel_agent_performance
    description: >
      Agent-level channel volumes, beneficiary concentration
      and behavioural risk indicators.
    config:
      meta:
        grain:
          - agent_sk
        audience:
          - Agent management
          - Channel management
    columns:
      - name: agent_sk
        data_tests:
          - not_null
          - unique

      - name: channel_risk_band
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

  - name: cns_pdm_social_impact
    description: >
      Special-group view of beneficiary reach, household reach,
      funding delivery and repayment participation.
    config:
      meta:
        grain:
          - special_group_sk
        audience:
          - Programme management
          - Social impact
    columns:
      - name: special_group_sk
        data_tests:
          - not_null
          - unique