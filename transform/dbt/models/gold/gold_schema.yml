version: 2

models:
  - name: dim_pdm_date
    description: Conformed calendar dimension used by all PDM Gold facts.
    columns:
      - name: date_sk
        data_tests: [not_null, unique]
      - name: calendar_date
        description: Null only for the mandatory Unknown dimension member.
        data_tests: [unique]
  - name: dim_pdm_geography
    description: Snowflaked Uganda geography dimension at region, district, parish and village grain.
    columns:
      - name: geography_sk
        data_tests: [not_null, unique]
  - name: dim_pdm_special_group
    description: PDM inclusion category dimension for women, youth, PWD and other targeted groups.
    columns:
      - name: special_group_sk
        data_tests: [not_null, unique]
  - name: dim_pdm_beneficiary
    description: Type-1 beneficiary dimension with geography and special-group surrogate keys.
    columns:
      - name: beneficiary_sk
        data_tests: [not_null, unique]
      - name: geography_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_geography')", field: geography_sk}
      - name: special_group_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_special_group')", field: special_group_sk}
  - name: dim_pdm_sacco
    description: Type-1 PDM SACCO dimension.
    columns:
      - name: sacco_sk
        data_tests: [not_null, unique]
  - name: dim_pdm_agent
    description: Type-1 Wendi agent dimension enriched with primary location coordinates.
    columns:
      - name: agent_sk
        data_tests: [not_null, unique]
  - name: fct_pdm_payments
    description: Atomic accumulating payment fact at source-system and transaction grain.
    meta: {grain: [source_system, transaction_id]}
    columns:
      - name: payment_sk
        data_tests: [not_null, unique]
      - name: payment_date_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_date')", field: date_sk}
      - name: beneficiary_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_beneficiary')", field: beneficiary_sk}
      - name: sacco_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_sacco')", field: sacco_sk}
      - name: agent_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_agent')", field: agent_sk}
      - name: geography_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_geography')", field: geography_sk}
  - name: fct_pdm_loans
    description: Atomic loan fact containing approved, disbursed, repaid and outstanding measures.
    meta: {grain: [loan_id]}
    columns:
      - name: loan_sk
        data_tests: [not_null, unique]
      - name: beneficiary_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_beneficiary')", field: beneficiary_sk}
      - name: sacco_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_sacco')", field: sacco_sk}
      - name: geography_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_geography')", field: geography_sk}
  - name: fct_pdm_agent_cashouts
    description: Transaction fact for agent cash-outs and fraud-monitoring signals.
    meta: {grain: [transaction_id]}
    columns:
      - name: cashout_sk
        data_tests: [not_null, unique]
      - name: beneficiary_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_beneficiary')", field: beneficiary_sk}
      - name: agent_sk
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_pdm_agent')", field: agent_sk}
  - name: fct_pdm_payment_lifecycle
    description: Accumulating control fact tracing each loan from approval through instruction, settlement, credit, cash-out and repayment.
    meta: {grain: [loan_id]}
    columns:
      - name: lifecycle_sk
        data_tests: [not_null, unique]
      - name: loan_id
        data_tests: [not_null, unique]
