version: 2

models:
  - name: gld_dim_pdm_date
    description: Conformed calendar dimension used by all PDM Gold facts.
    columns:
      - name: date_sk
        data_tests:
          - not_null
          - unique

      - name: calendar_date
        description: Null only for the mandatory Unknown dimension member.
        data_tests:
          - unique

  - name: gld_dim_pdm_geography
    description: >-
      Authoritative coarse analytical geography dimension at region, district,
      county and sub-county grain. Parish and village beneficiary linkage is
      prohibited; finer operational aggregates use SACCO/agent locations.
    columns:
      - name: geography_sk
        data_tests:
          - not_null
          - unique

      - name: district_sk
        description: Stable key for the Region to District path.
        data_tests:
          - not_null

      - name: county_sk
        description: Stable key for the Region to District to County path.
        data_tests:
          - not_null

      - name: sub_county_sk
        description: Stable key for the hierarchy through Sub County.
        data_tests:
          - not_null

  - name: gld_dim_pdm_special_group
    description: >-
      PDM inclusion category dimension for women, youth, PWD and other
      targeted groups.
    columns:
      - name: special_group_sk
        data_tests:
          - not_null
          - unique

  - name: gld_dim_pdm_beneficiary
    description: >-
      Type-1 pseudonymous beneficiary dimension keyed on the canonical
      beneficiary_token with special-group surrogate key and approved coarse
      geography. Clear identity, internal identifiers, household identifiers and
      fine-grained personal geography live only in the RESTRICTED identity
      vault; the geography_sk is the coarse
      (region/district/county/sub_county) surrogate key shared with the coarse
      geography dimension.
    columns:
      - name: beneficiary_sk
        data_tests:
          - not_null
          - unique

      - name: beneficiary_token
        description: Null only for the mandatory Unknown dimension member.
        data_tests:
          - unique

      - name: token_version
        description: >-
          Canonical beneficiary token key version. Null only for the mandatory
          Unknown dimension member, which intentionally has no beneficiary
          token.

      - name: special_group_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_special_group')"
              field: special_group_sk

      - name: geography_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_geography')"
              field: geography_sk

  - name: gld_dim_pdm_sacco
    description: Type-1 PDM SACCO dimension.
    columns:
      - name: sacco_sk
        data_tests:
          - not_null
          - unique

      - name: geography_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_geography')"
              field: geography_sk

  - name: gld_dim_pdm_agent
    description: >-
      Type-1 Wendi agent dimension enriched with primary location coordinates.
    columns:
      - name: agent_sk
        data_tests:
          - not_null
          - unique

      - name: geography_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_geography')"
              field: geography_sk

  - name: gld_fct_pdm_payments
    description: >-
      Atomic accumulating payment fact at source_system and record_identifier
      grain. The record_identifier supports heterogeneous payment message types,
      including payment initiation messages where transaction_id is
      legitimately null.
    columns:
      - name: payment_sk
        data_tests:
          - not_null
          - unique

      - name: payment_date_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_date')"
              field: date_sk

      - name: beneficiary_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_beneficiary')"
              field: beneficiary_sk

      - name: sacco_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_sacco')"
              field: sacco_sk

      - name: agent_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_agent')"
              field: agent_sk

      - name: beneficiary_token
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_beneficiary')"
              field: beneficiary_token

      - name: geography_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_geography')"
              field: geography_sk

  - name: gld_fct_pdm_loans
    description: >-
      Atomic loan fact. outstanding_balance and its legacy outstanding_amount
      alias both mean total contractual principal plus interest outstanding.
    columns:
      - name: loan_sk
        data_tests:
          - not_null
          - unique

      - name: beneficiary_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_beneficiary')"
              field: beneficiary_sk

      - name: sacco_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_sacco')"
              field: sacco_sk

      - name: beneficiary_token
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_beneficiary')"
              field: beneficiary_token

      - name: geography_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_geography')"
              field: geography_sk

  - name: gld_fct_pdm_agent_cashouts
    description: >-
      Transaction fact for agent cash-outs and fraud-monitoring signals.
    columns:
      - name: cashout_sk
        data_tests:
          - not_null
          - unique

      - name: beneficiary_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_beneficiary')"
              field: beneficiary_sk

      - name: agent_sk
        data_tests:
          - relationships:
              to: "ref('gld_dim_pdm_agent')"
              field: agent_sk

  - name: gld_fct_pdm_payment_lifecycle
    description: >-
      Accumulating control fact tracing each loan from approval through
      instruction, settlement, credit, cash-out and repayment.
    columns:
      - name: lifecycle_sk
        data_tests:
          - not_null
          - unique

      - name: loan_id
        data_tests:
          - not_null
          - unique