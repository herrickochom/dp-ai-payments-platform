        values:
        - TECHNICAL_PAYMENT_EVENT
  - name: x_provider
    description: Mobile-money provider executing the credit.
  - name: x_provider_transaction_id
    description: Provider-owned transaction reference.
  - name: x_cashout_status
    description: Final-mile cash-out state.
