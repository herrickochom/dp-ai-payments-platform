- name: br_pdm_ai_default_risk
  description: Current AI/ML 90-day default-risk prediction snapshot loaded from the
    platform prediction JSONL dataset.
  columns:
  - name: snapshot_id
    description: Prediction snapshot identifier.
    data_tests:
    - not_null
  - name: beneficiary_id
    description: Beneficiary identifier.
    data_tests:
    - not_null
  - name: loan_id
    description: Loan identifier.
    data_tests:
    - not_null
  - name: sacco_id
    description: SACCO identifier.
  - name: region
    description: Region name.
  - name: district
    description: District name.
  - name: county
    description: County name.
  - name: sub_county
    description: Sub-county name.
  - name: parish
    description: Parish name.
  - name: village
    description: Village name.
  - name: project_type
    description: Project type classification.
  - name: special_group
    description: Special-group classification.
  - name: observation_date
    description: Observation date used for scoring.
  - name: probability_default_90d
    description: Predicted 90-day probability of default.
  - name: ai_risk_band
    description: AI risk band label.
  - name: model_name
    description: Model name.
  - name: model_version
    description: Model version.
  - name: scored_at_utc
    description: Scoring timestamp (UTC).
  - name: risk_rank
    description: Rank of the prediction within the snapshot.
- name: br_pdm_payments_plm_lifecycle_events
  description: PLM provider, wallet, agent and cash-out lifecycle contract read directly
    from PLM staging.
  columns:
