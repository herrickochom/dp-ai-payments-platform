version: 2

models:

  # ============================================================================
  # AGENT NETWORK
  # ============================================================================

  - name: br_pdm_agent_locations
    description: Source-shaped agent location records decoded from Raw Avro.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: kafka_topic
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - agent.locations

      - name: kafka_partition
        data_tests:
          - not_null

      - name: kafka_offset
        data_tests:
          - not_null

      - name: kafka_timestamp
        data_tests:
          - not_null

      - name: record_source
        data_tests:
          - not_null

