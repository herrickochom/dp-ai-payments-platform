version: 2

models:
  - name: stg_pdm_icmn_vpm_pain001
    description: >
      ICMN VPM pain.001 business payment instructions, extracted from the raw Avro
      archive (parsed_event_data JSON) on topic icmn.vpm.pain001.
    meta:
      extraction_coverage: complete
      observed_source_leaf_fields: 24
    columns:
      - name: event_id
        tests: [not_null, unique]

      - name: message_id
        tests: [not_null]

      - name: end_to_end_id
        description: "Critical link: EndToEndId = loan_id."
        tests: [not_null]

      - name: kafka_topic
        tests: [not_null]

      - name: record_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - ICMN_VPM_PAIN001

  - name: stg_pdm_icmn_pmn_pain001
    description: >
      ICMN PMN pain.001 technical lifecycle initiation with x-* attributes, from
      topic icmn.pmn.pain001 (x_message_type falls back to the topic name when
      the x-attribute is absent).
    meta:
      extraction_coverage: complete
      observed_source_leaf_fields: 112
      repeated_field_strategy: "x-* fields are projected separately at group, payment and transaction levels"
    columns:
      - name: event_id
        tests: [not_null, unique]

      - name: message_id
        tests: [not_null]

      - name: end_to_end_id
        tests: [not_null]

      - name: x_message_type
        tests:
          - accepted_values:
              arguments:
                values:
                  - PMN
                  - icmn.pmn.pain001

      - name: record_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - ICMN_PMN_PAIN001

  - name: stg_pdm_cpo_psn_pain002
    description: >
      CPO PSN pain.002 business status reports, from topic cpo.psn.pain002.
      end_to_end_id is extracted from OrgnlEndToEndId and provides the direct
      loan link; original_message_id links back to the originating pain.001.
    meta:
      extraction_coverage: complete
      observed_source_leaf_fields: 15
    columns:
      - name: event_id
        tests: [not_null, unique]

      - name: message_id
        tests: [not_null]

      - name: transaction_status
        tests: [not_null]

      - name: original_message_id
        description: "Links back to the original pain.001 message (VPM/PMN MsgId)."
        tests: [not_null]

      - name: record_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - CPO_PSN_PAIN002

  - name: stg_pdm_cpo_plm_pain002
    description: >
      CPO PLM pain.002 technical lifecycle status with x-* attributes, from
      topic cpo.plm.pain002.
    meta:
      extraction_coverage: complete
      observed_source_leaf_fields: 113
      repeated_field_strategy: "x-* fields are projected separately at group, original-group and original-payment levels"
    columns:
      - name: event_id
        tests: [not_null, unique]

      - name: message_id
        tests: [not_null]

      - name: transaction_status
        tests: [not_null]

      - name: end_to_end_id
        description: "OrgnlEndToEndId = loan_id from the original payment instruction."
        tests: [not_null]

      - name: record_source
        tests:
          - accepted_values:
              arguments:
                values:
                  - CPO_PLM_PAIN002

