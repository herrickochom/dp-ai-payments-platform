        fixture_path: data/wendi/camt054/*.xml
        observed_leaf_fields: 17
  - name: wendi_transactions
    description: 'Wendi wallet transaction events. Topic: wendi.transactions

      '
    config:
      meta:
        fixture_path: data/wendi/wendi_transactions.json
        observed_leaf_fields: 25
  - name: mobile_mtn_pacs008
    description: 'MTN PACS.008 interbank settlements. Topic: mobile.mtn.pacs008

      '
    config:
      meta:
        fixture_path: data/mobile_networks/mtn/pacs008/*.xml
