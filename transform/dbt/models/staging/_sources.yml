  - name: wendi_pain001
    description: Wendi pain.001 payment initiation messages.
    config:
      meta:
        topic: wendi.pain001
        fixture_path: data/wendi/pain001/*.xml
        observed_leaf_fields: 88
  - name: wendi_pain002
    description: Wendi pain.002 payment status messages.
