  - name: mobile_mtn_pacs002
    description: 'MTN PACS.002 payment status reports. Topic: mobile.mtn.pacs002

      '
    config:
      meta:
        fixture_path: data/mobile_networks/mtn/pacs002/*.xml
        observed_leaf_fields: 32
  - name: mobile_airtel_pacs002
    description: 'Airtel PACS.002 payment status reports. Topic: mobile.airtel.pacs002

      '
    config:
      meta:
        fixture_path: data/mobile_networks/airtel/pacs002/*.xml
        observed_leaf_fields: 32
  - name: agent_transactions
    description: 'Agent network cash-out transactions. Topic: agent.transactions

      '
    config:
      meta:
        fixture_paths:
        - data/agent_network/agent_transactions/*.xml
        - data/agent_network/agent_transactions.json
        observed_xml_leaf_fields: 17
        observed_json_leaf_fields: 17
  - name: agent_profiles
