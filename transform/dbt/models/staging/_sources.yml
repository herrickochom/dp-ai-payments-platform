version: 2
sources:
- name: gcs_raw
  description: 'Raw payment events archived as immutable Avro in Google Cloud Storage
    under raw/v1/ by the payment-events consumer. The staging models project every
    leaf field observed in the current source fixtures, including Wendi payment messages
    and agent reference feeds.

    '
  tables:
  - name: icmn_vpm_pain001
    description: 'ICMN VPM pain.001 business payment initiation. Topic: icmn.vpm.pain001

      '
    config:
      meta:
        fixture_path: data/icmn/vpm/pain001/*.xml
        observed_leaf_fields: 24
  - name: icmn_pmn_pain001
    description: 'ICMN PMN standalone TechnicalPaymentEvent. Topic name is retained
      for compatibility: icmn.pmn.pain001

      '
    config:
      meta:
        fixture_path: data/icmn/pmn/pain001/*.xml
        observed_leaf_fields: 112
  - name: cpo_psn_pain002
    description: 'CPO PSN pain.002 business status reports. Topic: cpo.psn.pain002

      '
    config:
      meta:
        fixture_path: data/cpo/psn/pain002/*.xml
        observed_leaf_fields: 15
  - name: cpo_plm_pain002
    description: 'CPO PLM standalone TechnicalPaymentEvent. Topic name is retained
      for compatibility: cpo.plm.pain002

      '
    config:
      meta:
        fixture_path: data/cpo/plm/pain002/*.xml
        observed_leaf_fields: 113
  - name: wendi_camt053
    description: 'Wendi CAMT.053 end-of-day bank statements. Topic: wendi.camt053

      '
    config:
      meta:
        fixture_path: data/wendi/camt053/*.xml
        observed_leaf_fields: 37
  - name: wendi_camt052
    description: 'Wendi CAMT.052 intraday account reports. Topic: wendi.camt052

      '
