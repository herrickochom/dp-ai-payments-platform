# GCP-only dbt profile. Local configuration; no cloud operation during setup.
# Authentication: existing Google Application Default Credentials (ADC).
# Set DBT_GCP_PROJECT to the approved GCP project ID before dbt execution.
# Set DBT_GCP_LOCATION to the actual dataset location (default europe-west2).
# IMPORTANT: Standard dbt-bigquery table materialization is NOT native BigLake Iceberg V2 publication.
# Do not run models until the guarded Iceberg publication implementation is validated.
pdm_platform:
  target: gcp
  outputs:
    gcp:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_GCP_PROJECT') }}"
      dataset: staging
      location: "{{ env_var('DBT_GCP_LOCATION', 'europe-west2') }}"
      threads: 1
      priority: interactive
