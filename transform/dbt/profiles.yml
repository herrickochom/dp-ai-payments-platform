# /home/hochom/projects/dp-ai-payments-platform/transform/dbt/profiles.yml

pdm_platform:
  target: dev

  outputs:
    dev:
      type: duckdb

      # Local DuckDB execution database.
      path: "/tmp/pdm.duckdb"

      # Attached Nessie/Iceberg catalog alias.
      database: lakehouse

      # Default dbt schema.
      schema: staging

      # Keep dbt execution conservative for large synthetic datasets.
      threads: 1

      # ------------------------------------------------------------------------
      # DuckDB extensions
      # ------------------------------------------------------------------------

      extensions:
        - httpfs
        - avro
        - iceberg

      # ------------------------------------------------------------------------
      # DuckDB runtime / memory configuration
      # ------------------------------------------------------------------------

      settings:
        memory_limit: "6GB"
        preserve_insertion_order: false
        temp_directory: "/tmp/duckdb_swap"

        # MinIO / S3 configuration
        s3_region: "eu-west-1"
        s3_endpoint: "minio:9000"
        s3_url_style: "path"
        s3_use_ssl: false
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"

      secrets:
        - type: s3
          provider: config
          key_id: "{{ env_var('MINIO_ROOT_USER') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
          region: "eu-west-1"
          endpoint: "minio:9000"
          url_style: "path"
          use_ssl: false

      # ------------------------------------------------------------------------
      # Nessie Iceberg REST catalog
      # ------------------------------------------------------------------------

      attach:
        - path: payments
          alias: lakehouse
          options:
            type: iceberg
            endpoint: "{{ env_var('NESSIE_ENDPOINT', 'http://nessie:19120') }}/iceberg"
            authorization_type: none
            access_delegation_mode: none