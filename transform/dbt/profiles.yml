dp_ai_payments:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /tmp/dp_ai_payments.duckdb
      database: lakehouse
      schema: staging
      extensions: [httpfs, iceberg]
      settings:
        s3_region: eu-west-1
        s3_endpoint: minio:9000
        s3_url_style: path
        s3_use_ssl: false
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
      secrets:
        - type: s3
          provider: config
          key_id: "{{ env_var('MINIO_ROOT_USER') }}"
          secret: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
          region: eu-west-1
          endpoint: minio:9000
          url_style: path
          use_ssl: false
      attach:
        - path: payments
          alias: lakehouse
          options:
            type: iceberg
            endpoint: "{{ env_var('NESSIE_ENDPOINT', 'http://nessie:19120') }}/iceberg"
            authorization_type: none
            access_delegation_mode: none
