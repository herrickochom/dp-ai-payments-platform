# /home/hochom/projects/dp-ai-payments-platform/transform/dbt/profiles.yml
#
# Governed dbt execution profile.
#
# dbt executes through the dedicated transform Trino boundary.
# Trino, not dbt, owns the Nessie REST and S3 configuration.
#
# The transform Trino catalog is bound at startup to:
#
#   transform_<run>|<NESSIE_WAREHOUSE>
#
# Therefore dbt must never connect directly to Nessie or MinIO and must
# never select or default to the Nessie main branch.

pdm_platform:
  target: runtime

  outputs:
    runtime:
      type: trino

      # Trino PASSWORD authentication.
      method: ldap
      user: "{{ env_var('DBT_TRINO_USER') }}"
      password: "{{ env_var('DBT_TRINO_PASSWORD') }}"

      # Dedicated transform Trino service.
      host: "{{ env_var('DBT_TRINO_HOST') }}"
      port: "{{ env_var('DBT_TRINO_PORT', '8443') | int }}"
      http_scheme: https

      # The transform Trino exposes the run-scoped Nessie catalog as
      # the normal logical Iceberg catalog.
      database: iceberg

      # Default dbt schema. Individual models may override this through
      # their existing dbt configuration.
      schema: staging

      # Keep governed transform execution conservative.
      threads: 1