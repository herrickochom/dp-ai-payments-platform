# =============================================================================
# DP AI PAYMENTS PLATFORM
# Docker Compose — Local Production-Semantics Environment
# =============================================================================
#
# Author: Herrick OCHOM
# Role:   Data Architect
# Date:   18/09/2026
#
# Architecture:
#   Source Systems -> Producers / CDC -> Kafka -> Raw / MinIO
#                  -> Staging -> Bronze -> Silver -> Gold -> Consumption
#
# Design principles:
#   - Kafka does not write directly to Bronze.
#   - payment-consumer-events owns durable Kafka -> Raw ingestion.
#   - dbt / DuckDB own Raw -> Staging -> Bronze transformation.
#   - CDC is fail-closed and activated only for explicitly governed sources.
#   - Optional platform capabilities are controlled through Compose profiles.
#   - Production infrastructure provisioning is owned by Terraform / IaC.
#
# =============================================================================

services:

  # ------------------------------------------------------------------
  # 01. CORE PLATFORM INFRASTRUCTURE
  # ------------------------------------------------------------------
  #
  # Shared persistence and foundational platform services.
  # PostgreSQL here is platform infrastructure and is not a CDC source.

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    - --save
    - '60'
    - '1000'
    volumes:
    - redis-data:/data
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  postgres:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgresql
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-postgres
    environment:
      QUARKUS_CONFIG_LOCATIONS: /deployments/config/application.properties
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
      POSTGRES_MULTIPLE_DATABASES: metabase
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
  postgres-healthcheck:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgres-healthcheck
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-postgres-healthcheck
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    command:
    - bash
    - -c
    - sleep 10 && /healthcheck.sh
    networks:
    - data-platform-network
  minio:
    image: quay.io/minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
    - ${MINIO_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data:/data
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init-buckets:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-buckets
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio-init-buckets
    environment:
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_PREFIX: raw/v2
      MINIO_ALIAS: local
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
  minio-init-databases:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-databases
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio-init-databases
    environment:
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network

  # ------------------------------------------------------------------
  # 02. EVENT STREAMING — KAFKA & SCHEMA REGISTRY
  # ------------------------------------------------------------------
  #
  # Durable event transport and schema governance.
  # CDC integrations also converge on Kafka when explicitly activated.

  kafka-volume-init:
    image: apache/kafka:4.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka-volume-init
    user: 0:0
    entrypoint:
    - bash
    - -c
    - chown -R 1000:1000 /var/lib/kafka/data /var/lib/kafka/metadata
    volumes:
    - kafka-data:/var/lib/kafka/data
    - kafka-metadata:/var/lib/kafka/metadata
    restart: 'no'
    networks:
    - data-platform-network
  kafka:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-broker
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka
    environment:
      CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: '1'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_HEAP_OPTS: -Xmx512M
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
    - ${KAFKA_EXTERNAL_PORT:-9094}:9094
    volumes:
    - kafka-data:/var/lib/kafka/data
    - kafka-metadata:/var/lib/kafka/metadata
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      kafka-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo > /dev/tcp/localhost/9092
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-init
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      TOPICS_CONFIG: /app/topics.yaml
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    networks:
    - data-platform-network
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_LEADER_ELECTION_TYPE: static
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: 'true'
      SCHEMA_REGISTRY_KAFKASTORE_GROUP_ID: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: GET,POST,PUT,DELETE,OPTIONS
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 60000
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 120000
      SCHEMA_REGISTRY_DEBUG: 'true'
    ports:
    - 8081:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8081/subjects || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  schema-registry-init:
    image: curlimages/curl:8.10.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-schema-registry-init
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_COMPATIBILITY: BACKWARD_TRANSITIVE
    volumes:
    - ./platform/kafka/configure-schema-registry.sh:/configure-schema-registry.sh:ro
    entrypoint:
    - /bin/sh
    - /configure-schema-registry.sh
    depends_on:
      schema-registry:
        condition: service_healthy
    restart: 'no'
    networks:
    - data-platform-network

  # ------------------------------------------------------------------
  # 03. LAKEHOUSE CATALOGUE
  # ------------------------------------------------------------------
  #
  # Iceberg catalogue and controlled REST integration surface.

  nessie:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-nessie
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_DB: "${POSTGRES_DB}"
      NESSIE_DEFAULT_WAREHOUSE: "${NESSIE_DEFAULT_WAREHOUSE}"
      WAREHOUSE_BUCKET: "${WAREHOUSE_BUCKET}"
      OBJECT_STORE_REGION: "${OBJECT_STORE_REGION}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_PATH_STYLE_ACCESS: "${S3_PATH_STYLE_ACCESS}"
      NESSIE_S3_ACCESS_KEY: "${NESSIE_S3_ACCESS_KEY}"
      NESSIE_S3_SECRET_KEY: "${NESSIE_S3_SECRET_KEY}"
      NESSIE_S3_AUTH_TYPE: "${NESSIE_S3_AUTH_TYPE}"
      NESSIE_S3_EXTERNAL_ENDPOINT: "${NESSIE_S3_EXTERNAL_ENDPOINT}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: payments
      NESSIE_CATALOG_WAREHOUSES_PAYMENTS_LOCATION: s3://dp-ai-payment/warehouse
      MINIO_NAME: ${MINIO_ROOT_USER}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD}
    ports:
    - ${NESSIE_PORT:-19120}:19120
    volumes:
    - nessie-data:/var/lib/nessie
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:19120/api/v2/trees >/dev/null && curl -fsS 'http://localhost:19120/iceberg/v1/config?warehouse=payments'
        >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
    - data-platform-network
  nessie-rest-proxy:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie-rest-proxy
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-nessie-rest-proxy
    profiles:
    - analytics
    - duckdb
    environment:
      NESSIE_UPSTREAM: ${NESSIE_ENDPOINT}
      PUBLIC_BASE: http://nessie-rest-proxy:19121
    depends_on:
      nessie:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network

  # ------------------------------------------------------------------
  # 04. SOURCE GENERATION & GOVERNED INGESTION
  # ------------------------------------------------------------------
  #
  # Governed path:
  #   Source Systems -> Producer -> Kafka -> Raw / MinIO
  #
  # Kafka does not ingest directly into Bronze.
  # The Raw consumer commits Kafka offsets only after durable handling.

  payment-xml-generator:
    profiles:
    - generate-data
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-xml-generator
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-payment-xml-generator
    environment:
      DATA_ROOT: /app/data
      PYTHONUNBUFFERED: '1'
    volumes:
    - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
    command:
    - --count
    - ${PDM_GENERATOR_COUNT:-250}
  payment-producer:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-producer
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-payment-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DATA_ROOT: /app/data
      PRODUCER_IDEMPOTENCE: 'true'
      PRODUCER_ACKS: all
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
    volumes:
    - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
  payment-consumer-events:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-consumer-events
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_PREFIX: raw/v2
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_GROUP_ID: payment-events-consumer
      KAFKA_RETRY_TOPIC: payment-events.retry
      KAFKA_DLQ_TOPIC: payment-events.dlq
      MAX_PROCESSING_RETRIES: ${MAX_PROCESSING_RETRIES:-3}
      RETRY_INITIAL_DELAY_SECONDS: ${RETRY_INITIAL_DELAY_SECONDS:-1}
      RETRY_BACKOFF_MULTIPLIER: ${RETRY_BACKOFF_MULTIPLIER:-2}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPICS: icmn.vpm.pain001,icmn.pmn.pain001,cpo.psn.pain002,cpo.plm.pain002,wendi.pain001,wendi.pain002,wendi.camt053,wendi.camt052,wendi.camt054,wendi.transactions,mobile.mtn.pacs008,mobile.mtn.pacs002,mobile.airtel.pacs008,mobile.airtel.pacs002,agent.transactions,agent.profiles,agent.locations,pdmis.beneficiaries,pdmis.loans,pdmis.repayments,pdmis.saccos,pdmis.households,pdmis.business_plans,pdmis.special_groups
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init-buckets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - python3
      - /app/raw_data_healthcheck.py
      interval: 5s
      timeout: 15s
      retries: 120
      start_period: 5s

  # ------------------------------------------------------------------
  # 05. QUERY & TRANSFORMATION
  # ------------------------------------------------------------------
  #
  # Transformation path:
  #   Raw -> Staging -> Bronze -> Silver -> Gold -> Consumption

  trino:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.trino-coordinator
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-trino
    user: 0:0
    profiles:
    - analytics
    - agents
    - trino
    - dbt
    - dashboard
    - superset
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      TRINO_DATABASE_NAME: "${TRINO_DATABASE_NAME}"
      TRINO_HOST: "${TRINO_HOST}"
      TRINO_PORT: "${TRINO_PORT}"
      JAVA_TOOL_OPTIONS: -Xmx768M
      TRINO_CONFIG_DIR: /etc/trino
      TRINO_INTERNAL_SHARED_SECRET: ${TRINO_INTERNAL_SHARED_SECRET}
      TRINO_KEYSTORE_PASSWORD: ${TRINO_KEYSTORE_PASSWORD:?TRINO_KEYSTORE_PASSWORD must be supplied by environment}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 8089:8080
    - 8443:8443
    volumes:
    - ./platform/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
    - ./platform/trino/etc/config.properties:/etc/trino/config.properties:ro
    - ./platform/trino/etc/event-listeners.json:/etc/trino/event-listeners.json:ro
    - ./platform/trino/etc/jvm.config:/etc/trino/jvm.config:ro
    - ./platform/trino/etc/log.properties:/etc/trino/log.properties:ro
    - ./platform/trino/etc/node.properties:/etc/trino/node.properties:ro
    - ./platform/trino/etc/password-auth.properties:/etc/trino/password-auth.properties:ro
    - ./platform/trino/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
    - ./platform/trino/etc/rules.json:/etc/trino/rules.json:ro
    - ./platform/trino/etc/password.db:/etc/trino/password.db:ro
    - ./platform/trino/etc/trino-keystore.jks:/etc/trino/trino-keystore.jks:ro
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/v1/info
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
  duckdb:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.duckdb
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-duckdb
    profiles:
    - analytics
    - duckdb
    - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_BUCKET: dp-ai-payment
      RAW_ROOT: raw/v2
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
    volumes:
    - ./transform/dbt:/usr/app/dbt
    - ./data:/app/data
    - dbt-logs:/usr/app/dbt/logs
    - ./tmp/duckdb:/tmp/pdm.duckdb.tmp
    restart: 'no'
    networks:
    - data-platform-network
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      payment-consumer-events:
        condition: service_healthy
    command:
    - build
  dbt:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.dbt
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-dbt
    profiles:
    - analytics
    - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      TRINO_HOST: trino
      TRINO_PORT: 8080
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_ROOT: raw/v2
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
      DP_TOKEN_KEY: ${DP_TOKEN_KEY}
      DP_TOKEN_KEY_VERSION: ${DP_TOKEN_KEY_VERSION}
    volumes:
    - ./transform/dbt:/usr/app/dbt
    - ./data:/app/data
    - dbt-logs:/usr/app/dbt/logs
    - ./tmp/duckdb:/tmp/pdm.duckdb.tmp
    restart: 'no'
    networks:
    - data-platform-network
    depends_on:
      trino:
        condition: service_healthy
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      duckdb:
        condition: service_completed_successfully
  dbt-docs:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.dbt-docs
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-dbt-docs
    profiles:
    - analytics
    - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
    ports:
    - 3001:3000
    restart: unless-stopped
    networks:
    - data-platform-network
    depends_on:
      dbt:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # 06. MACHINE LEARNING — FEATURE ENGINEERING & INFERENCE
  # ------------------------------------------------------------------
  #
  # Operational feature generation and predictive-risk scoring.
  # Model training is intentionally excluded from the deployable runtime.

  pdm-ml-features:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.pdm-ml
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-pdm-ml-features
    profiles:
    - ml
    - ai
    environment:
      PYTHONUNBUFFERED: '1'
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
