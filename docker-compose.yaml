        condition: service_healthy
      schema-registry:
        condition: service_healthy
  # ============================================================================
  # 5B. PDM AI / MACHINE LEARNING LAYER
  # ============================================================================
  #
  # Flow:
  # dbt Gold / Consumption
  #       -> feature engineering
  #       -> model training
  #       -> persisted models
  #       -> scoring
  #       -> risk / anomaly outputs
  #       -> Trino / Superset dashboards
  #
  # Source code:
  #   services/pdm-ml/features
  #   services/pdm-ml/training
  #   services/pdm-ml/models
  #   services/pdm-ml/scoring
  # ============================================================================

  pdm-ml-features:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.pdm-ml
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-pdm-ml-features
    profiles:
      - ml
      - ai
    environment:
      PYTHONUNBUFFERED: "1"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment

      NESSIE_ENDPOINT: http://nessie:19120

      PDM_ML_SAMPLE_SIZE: ${PDM_ML_SAMPLE_SIZE:-100}

    volumes:
      - ./services/pdm-ml:/app/pdm-ml
      - ./data:/app/data

    working_dir: /app/pdm-ml

    restart: "no"

    networks:
      - data-platform-network

    depends_on:
      trino:
        condition: service_healthy
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy

    command:
      - python
      - features/build_current_default_risk_features.py
      - --pdmis-root
      - /app/data/pdmis
      - --metadata
      - /app/pdm-ml/models/pdm_default_risk_strict_early_warning_v1_metadata.json
      - --output
      - /app/data/pdmis_ml/default_risk_current_scoring.jsonl
      - --summary
      - /app/data/pdmis_ml/default_risk_current_scoring_summary.json

  pdm-ml-training:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.pdm-ml
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-pdm-ml-training
    profiles:
      - ml
      - ai
    environment:
      PYTHONUNBUFFERED: "1"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment

      NESSIE_ENDPOINT: http://nessie:19120

      PDM_ML_SAMPLE_SIZE: ${PDM_ML_SAMPLE_SIZE:-100}
      PDM_ML_MODEL_DIR: /app/pdm-ml/models

    volumes:
      - ./services/pdm-ml:/app/pdm-ml
      - ./data:/app/data

    working_dir: /app/pdm-ml

    restart: "no"

    networks:
      - data-platform-network

    depends_on:
      pdm-ml-features:
        condition: service_completed_successfully

    command:
      - python
      - training/train_default_risk.py
      - --input
      - /app/data/pdmis_ml/default_risk_training_snapshots.jsonl
      - --model-dir
      - /app/pdm-ml/models

  pdm-ml-scoring:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.pdm-ml
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-pdm-ml-scoring
    profiles:
      - ml
      - ai
    environment:
      PYTHONUNBUFFERED: "1"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment

      NESSIE_ENDPOINT: http://nessie:19120

      PDM_ML_SAMPLE_SIZE: ${PDM_ML_SAMPLE_SIZE:-100}
      PDM_ML_MODEL_DIR: /app/pdm-ml/models

    volumes:
      - ./services/pdm-ml:/app/pdm-ml
      - ./data:/app/data

    working_dir: /app/pdm-ml

    restart: "no"

    networks:
      - data-platform-network

    depends_on:
      pdm-ml-features:
        condition: service_completed_successfully

    command:
      - python
      - scoring/score_default_risk.py
      - --model
      - /app/pdm-ml/models/pdm_default_risk_strict_early_warning_v1.joblib
      - --metadata
      - /app/pdm-ml/models/pdm_default_risk_strict_early_warning_v1_metadata.json
      - --input
      - /app/data/pdmis_ml/default_risk_current_scoring.jsonl
      - --output
      - /app/data/pdmis_ml/default_risk_current_predictions.jsonl
      - --summary
      - /app/data/pdmis_ml/default_risk_current_predictions_summary.json

