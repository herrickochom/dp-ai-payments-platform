  # ------------------------------------------------------------------
  # 08. BUSINESS INTELLIGENCE
  # ------------------------------------------------------------------
  #
  # Consumption-facing analytics and dashboard services.

  metabase:
    image: metabase/metabase:v0.49.10
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-metabase
    profiles:
    - analytics
    - metabase
    - dashboard
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: '5432'
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_NAME: PDM Analytics
      MB_SITE_LOCALE: en
      MB_JETTY_PORT: '3000'
      JAVA_TIMEZONE: Africa/Kampala
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
    ports:
    - ${METABASE_PORT:-3000}:3000
    volumes:
    - metabase-data:/metabase-data
    - ./platform/trino/etc/trino-truststore.jks:/etc/metabase/trino-truststore.jks:ro
    - ./platform/metabase/plugins/starburst-4.1.0.metabase-driver.jar:/plugins/starburst-4.1.0.metabase-driver.jar:ro
    restart: unless-stopped
    networks:
    - data-platform-network
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
  superset-init:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-superset-init
    profiles:
    - analytics
    - superset
    - dashboard
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: 'no'
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-PDM}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Administrator}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@pdm.local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      TRINO_DATABASE_NAME: ${TRINO_DATABASE_NAME:-PDM Trino}
      TRINO_SQLALCHEMY_URI: ${TRINO_SQLALCHEMY_URI:-trino://trino@trino:8080/iceberg/consumption}
    volumes:
    - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./platform/superset:/app/platform/superset:ro
    - superset-data:/app/superset_home
    restart: 'no'
    networks:
    - data-platform-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy
    command:
    - /bin/bash
    - -c
    - "set -euo pipefail\n\necho \"Running Superset metadata migrations...\"\nsuperset db upgrade\n\necho \"Creating initial\
      \ administrator if required...\"\nsuperset fab create-admin           --username \"$${SUPERSET_ADMIN_USERNAME}\"     \
      \      --firstname \"$${SUPERSET_ADMIN_FIRSTNAME}\"           --lastname \"$${SUPERSET_ADMIN_LASTNAME}\"           --email\
      \ \"$${SUPERSET_ADMIN_EMAIL}\"           --password \"$${SUPERSET_ADMIN_PASSWORD}\" || true\n\necho \"Synchronising Superset\
      \ roles and permissions...\"\nsuperset init\n\necho \"Registering/updating Trino database connection...\"\npython - <<'PY'\n\
      import os\n\nfrom superset.app import create_app\n\napp = create_app()\n\nwith app.app_context():\n    from superset import\
      \ db\n    from superset.models.core import Database\n\n    database_name = os.getenv(\"TRINO_DATABASE_NAME\", \"PDM Trino\"\
      )\n    sqlalchemy_uri = os.getenv(\n        \"TRINO_SQLALCHEMY_URI\",\n        \"trino://trino@trino:8080/iceberg/consumption\"\
      ,\n    )\n\n    database = (\n        db.session.query(Database)\n        .filter(Database.database_name == database_name)\n\
      \        .first()\n    )\n\n    if database is None:\n        database = Database(\n            database_name=database_name,\n\
      \            sqlalchemy_uri=sqlalchemy_uri,\n            expose_in_sqllab=True,\n            allow_ctas=False,\n     \
      \       allow_cvas=False,\n            allow_dml=False,\n        )\n        db.session.add(database)\n        action =\
      \ \"Created\"\n    else:\n        database.sqlalchemy_uri = sqlalchemy_uri\n        database.expose_in_sqllab = True\n\
      \        database.allow_ctas = False\n        database.allow_cvas = False\n        database.allow_dml = False\n      \
      \  action = \"Updated\"\n\n    db.session.commit()\n\n    print(\n        f\"{action} Superset Trino connection: \"\n\
      \        f\"id={database.id}, name={database.database_name}\"\n    )\nPY\n\necho \"Superset initialization completed successfully.\"\
      \n"
  superset:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-superset
    profiles:
    - analytics
    - superset
    - dashboard
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: 'no'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      SUPERSET_WEB_WORKERS: ${SUPERSET_WEB_WORKERS:-4}
      SUPERSET_WEB_THREADS: ${SUPERSET_WEB_THREADS:-4}
      SUPERSET_WEBSERVER_TIMEOUT: ${SUPERSET_WEBSERVER_TIMEOUT:-120}
    ports:
    - ${SUPERSET_PORT:-8088}:8088
    volumes:
    - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./platform/superset:/app/platform/superset:ro
    - ./platform/superset/dashboards/Coat-of-arms-Uganda.webp:/app/superset/static/assets/images/Coat-of-arms-Uganda.webp:ro
    - superset-data:/app/superset_home
    restart: unless-stopped
    networks:
    - data-platform-network
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    command:
    - /bin/bash
    - -c
    - 'set -euo pipefail


      exec gunicorn           --bind 0.0.0.0:8088           --workers "$${SUPERSET_WEB_WORKERS}"           --worker-class gthread           --threads
      "$${SUPERSET_WEB_THREADS}"           --timeout "$${SUPERSET_WEBSERVER_TIMEOUT}"           --access-logfile -           --error-logfile
      -           "superset.app:create_app()"

      '
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8088/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
  superset-worker:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-superset-worker
    profiles:
    - analytics
    - superset
    - dashboard
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      SUPERSET_CELERY_WORKERS: ${SUPERSET_CELERY_WORKERS:-2}
    volumes:
    - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./platform/superset:/app/platform/superset:ro
    - superset-data:/app/superset_home
    restart: unless-stopped
    networks:
    - data-platform-network
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
    - /bin/bash
    - -c
    - 'set -euo pipefail


      exec celery           --app=superset.tasks.celery_app:app           worker           -O fair           --loglevel=INFO           --concurrency="$${SUPERSET_CELERY_WORKERS}"

      '
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME | grep -q pong
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------
  # 09. ORCHESTRATION & CONTROL PLANE
  # ------------------------------------------------------------------
  #
  # Governed workflow orchestration and bounded job execution.

  transform-ledger-migrate:
    profiles:
    - airflow
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.platform-job-runner
    working_dir: /app
    command: ["python", "-m", "orchestration.transform_runtime.migrate"]
    environment:
      TRANSFORM_LEDGER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - data-platform-network
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'

  transform-runtime:
    profiles:
    - airflow
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.platform-job-runner
    working_dir: /app
    command: ["uvicorn", "orchestration.transform_runtime.api:app", "--host", "0.0.0.0", "--port", "8089"]
    environment:
      LAKEHOUSE_TRANSFORM_EXECUTION_ENABLED: 'false'
      LAKEHOUSE_TRANSFORM_CONTRACT: /app/orchestration/transform_runtime/contracts/lakehouse_transform.json
      TRANSFORM_RUNTIME_AIRFLOW_TOKEN: ${TRANSFORM_RUNTIME_AIRFLOW_TOKEN:?TRANSFORM_RUNTIME_AIRFLOW_TOKEN is required}
      TRANSFORM_RUNTIME_RUNNER_TOKEN: ${TRANSFORM_RUNTIME_RUNNER_TOKEN:?TRANSFORM_RUNTIME_RUNNER_TOKEN is required}
      TRANSFORM_LEDGER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NESSIE_ENDPOINT: "${NESSIE_ENDPOINT}"
      NESSIE_AUTH_TOKEN: ${NESSIE_AUTH_TOKEN:?NESSIE_AUTH_TOKEN is required}
      TRANSFORM_RUNNER_URL: http://platform-job-runner:8090
    depends_on:
      transform-ledger-migrate:
        condition: service_completed_successfully
    networks:
    - data-platform-network
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform-job-runner:
    profiles:
    - airflow
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.platform-job-runner
    environment:
      DBT_DATABASE: "${DBT_DATABASE}"
      DBT_STAGING_DATABASE: "${DBT_STAGING_DATABASE}"
      DBT_BRONZE_DATABASE: "${DBT_BRONZE_DATABASE}"
      DBT_SILVER_DATABASE: "${DBT_SILVER_DATABASE}"
      DBT_SILVER_VAULT_DATABASE: "${DBT_SILVER_VAULT_DATABASE}"
      DBT_GOLD_DATABASE: "${DBT_GOLD_DATABASE}"
      DBT_CONSUMPTION_DATABASE: "${DBT_CONSUMPTION_DATABASE}"
      DBT_S3_URL_STYLE: "${DBT_S3_URL_STYLE}"
      NESSIE_ENDPOINT: "${NESSIE_ENDPOINT}"
      WAREHOUSE_BUCKET: "${WAREHOUSE_BUCKET}"
      ICEBERG_CATALOG: "${ICEBERG_CATALOG}"
      PLATFORM_RUNNER_EXECUTION_ENABLED: 'false'
      PLATFORM_JOB_EXECUTION_ENABLED: 'false'
      TRANSFORM_RUNTIME_RUNNER_TOKEN: ${TRANSFORM_RUNTIME_RUNNER_TOKEN:?TRANSFORM_RUNTIME_RUNNER_TOKEN is required}
      TRANSFORM_LEDGER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORDINARY_S3_ACCESS_KEY_ID: ${ORDINARY_TRANSFORM_S3_ACCESS_KEY_ID:?ORDINARY_TRANSFORM_S3_ACCESS_KEY_ID is required}
      ORDINARY_S3_SECRET_ACCESS_KEY: ${ORDINARY_TRANSFORM_S3_SECRET_ACCESS_KEY:?ORDINARY_TRANSFORM_S3_SECRET_ACCESS_KEY is required}
      RESTRICTED_S3_ACCESS_KEY_ID: ${RESTRICTED_TRANSFORM_S3_ACCESS_KEY_ID:?RESTRICTED_TRANSFORM_S3_ACCESS_KEY_ID is required}
      RESTRICTED_S3_SECRET_ACCESS_KEY: ${RESTRICTED_TRANSFORM_S3_SECRET_ACCESS_KEY:?RESTRICTED_TRANSFORM_S3_SECRET_ACCESS_KEY is required}
      ML_S3_ACCESS_KEY_ID: ${ML_TRANSFORM_S3_ACCESS_KEY_ID:?ML_TRANSFORM_S3_ACCESS_KEY_ID is required}
      ML_S3_SECRET_ACCESS_KEY: ${ML_TRANSFORM_S3_SECRET_ACCESS_KEY:?ML_TRANSFORM_S3_SECRET_ACCESS_KEY is required}
      NESSIE_AUTH_TOKEN: ${NESSIE_AUTH_TOKEN:?NESSIE_AUTH_TOKEN is required}
      KAFKA_TOPICS: icmn.vpm.pain001,icmn.pmn.pain001,cpo.psn.pain002,cpo.plm.pain002,wendi.pain001,wendi.pain002,wendi.camt053,wendi.camt052,wendi.camt054,wendi.transactions,mobile.mtn.pacs008,mobile.mtn.pacs002,mobile.airtel.pacs008,mobile.airtel.pacs002,agent.transactions,agent.profiles,agent.locations,pdmis.beneficiaries,pdmis.loans,pdmis.repayments,pdmis.saccos,pdmis.households,pdmis.business_plans,pdmis.special_groups
      PLATFORM_RAW_READ_ACCESS_KEY: ${PLATFORM_RAW_READ_ACCESS_KEY:?PLATFORM_RAW_READ_ACCESS_KEY is required}
      PLATFORM_RAW_READ_SECRET_KEY: ${PLATFORM_RAW_READ_SECRET_KEY:?PLATFORM_RAW_READ_SECRET_KEY is required}
      MINIO_BUCKET: dp-ai-payment
      RAW_PREFIX: raw/v2
      S3_ENDPOINT: ${S3_ENDPOINT}
    volumes:
    - ./data/pdmis_ml:/app/data/pdmis_ml:ro
    networks:
    - data-platform-network
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    - /var/lib/platform-job-runner/work:uid=50001,gid=50001,mode=0700
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen( 'http://localhost:8090/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  airflow-init:
    profiles:
    - airflow
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.airflow
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-airflow-init
    user: 0:0
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      PYTHONPATH: /opt/airflow/job_runner
      PLATFORM_JOB_AUDIT_PATH: /var/lib/platform-job-runner/audit.jsonl
      PLATFORM_JOB_RUNNER_URL: http://platform-job-runner:8090
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/8
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-2}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is required}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      PYTHONUNBUFFERED: '1'
