  payment-producer-dev:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-producer
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-payment-producer-dev
    profiles:
