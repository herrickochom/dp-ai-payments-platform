    environment:
      API_PORT: 7001
      MINIO_ENDPOINT: http://minio:9000
      NESSIE_ENDPOINT: http://nessie:19120
      TRINO_HOST: trino
      TRINO_PORT: 8080
    ports:
      - "7001:7001"
    volumes:
      - ./services/payments-api:/app/src
    restart: unless-stopped
    networks:
      - data-platform-network
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy

  dq-agent:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.dq-agent
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-dq-agent
    profiles:
      - dev
      - dq
    environment:
