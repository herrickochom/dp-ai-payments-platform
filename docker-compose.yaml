services:
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    - --save
    - '60'
    - '1000'
    volumes:
    - redis-data:/data
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  postgres:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgresql
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-postgres
    environment:
      QUARKUS_CONFIG_LOCATIONS: /deployments/config/application.properties
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
      POSTGRES_MULTIPLE_DATABASES: metabase
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
  postgres-healthcheck:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgres-healthcheck
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-postgres-healthcheck
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    command:
    - bash
    - -c
    - sleep 10 && /healthcheck.sh
    networks:
    - data-platform-network
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-pgadmin
    profiles:
    - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_DISABLE_POSTFIX: '1'
    entrypoint:
    - /bin/sh
    - -ec
    - ': "$${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}"; : "$${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD
      is required}"; exec /entrypoint.sh'
    ports:
    - 127.0.0.1:${PGADMIN_PORT:-5050}:80
    volumes:
    - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network
  pdm-source-postgres:
    image: postgres:16.15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-pdm-source-postgres
    profiles:
    - cdc
    environment:
      POSTGRES_DB: ${PDM_SOURCE_DB:-}
      POSTGRES_USER: ${PDM_SOURCE_USER:-}
      POSTGRES_PASSWORD: ${PDM_SOURCE_PASSWORD:-}
      PDM_CDC_USER: ${PDM_CDC_USER:-}
      PDM_CDC_PASSWORD: ${PDM_CDC_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint:
    - /bin/sh
    - /pdm-source-entrypoint.sh
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=4
    - -c
    - max_wal_senders=4
    - -c
    - max_slot_wal_keep_size=1024MB
    volumes:
    - pdm-source-pgdata:/var/lib/postgresql/data
    - ./platform/pdm-source-postgres/pdm-source-entrypoint.sh:/pdm-source-entrypoint.sh:ro
    - ./platform/pdm-source-postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
    - 127.0.0.1:${PDM_SOURCE_PORT:-5433}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
    - data-platform-network
  minio:
    image: ${MINIO_SERVER_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_CERT_DIR: ${MINIO_CERT_DIR:-}
    command: server /data --console-address ":9001" ${MINIO_CERT_DIR:+--certs-dir /certs}
    ports:
    - ${MINIO_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data:/data
    - ${MINIO_CERT_DIR:-/etc/minio/certs}:/certs:ro
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init-buckets:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-buckets
      args:
        MINIO_MC_IMAGE: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio-init-buckets
    environment:
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
      MINIO_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
      RAW_ROOT: ${RAW_ROOT:?RAW_ROOT is required}
      RAW_VERSION: ${RAW_VERSION:?RAW_VERSION is required}
      RAW_PREFIX: ${RAW_PREFIX:?RAW_PREFIX is required}
      MINIO_ALIAS: local
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
  minio-init-databases:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-databases
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-minio-init-databases
    environment:
      DP_SECRET_SOURCE: ${DP_SECRET_SOURCE:-}
      DP_SECRET_DIR: ${DP_SECRET_DIR:-}
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_USE_SSL: ${S3_USE_SSL:?S3_USE_SSL is required}
      S3_CA_BUNDLE: ${S3_CA_BUNDLE}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?OBJECT_STORE_REGION is required}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
  kafka-volume-init:
    image: apache/kafka:4.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka-volume-init
    user: 0:0
    entrypoint:
    - bash
    - -c
    - chown -R 1000:1000 /var/lib/kafka/data /var/lib/kafka/metadata
    volumes:
    - kafka-data:/var/lib/kafka/data
    - kafka-metadata:/var/lib/kafka/metadata
    restart: 'no'
    networks:
    - data-platform-network
  kafka:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-broker
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka
    environment:
      CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: '1'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_HEAP_OPTS: -Xmx512M
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
    - ${KAFKA_EXTERNAL_PORT:-9094}:9094
    volumes:
    - kafka-data:/var/lib/kafka/data
    - kafka-metadata:/var/lib/kafka/metadata
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      kafka-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo > /dev/tcp/localhost/9092
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-init
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      TOPICS_CONFIG: /app/topics.yaml
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-}
      KAFKA_SSL_CERTIFICATE_LOCATION: ${KAFKA_SSL_CERTIFICATE_LOCATION:-}
      KAFKA_SSL_KEY_LOCATION: ${KAFKA_SSL_KEY_LOCATION:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    networks:
    - data-platform-network
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_LEADER_ELECTION_TYPE: static
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: 'true'
      SCHEMA_REGISTRY_KAFKASTORE_GROUP_ID: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: GET,POST,PUT,DELETE,OPTIONS
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 60000
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 120000
      SCHEMA_REGISTRY_DEBUG: 'true'
    ports:
    - 8081:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8081/subjects || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  schema-registry-init:
    image: curlimages/curl:8.10.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-schema-registry-init
    environment:
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      SCHEMA_REGISTRY_AUTH_REQUIRED: ${SCHEMA_REGISTRY_AUTH_REQUIRED:-false}
      SCHEMA_REGISTRY_HTTPS_CA: ${SCHEMA_REGISTRY_HTTPS_CA:-}
      SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
      SCHEMA_COMPATIBILITY: BACKWARD_TRANSITIVE
    volumes:
    - ${SCHEMA_REGISTRY_CERT_DIR:-/etc/schema-registry/certs}:/etc/schema-registry/certs:ro
    - ./platform/kafka/configure-schema-registry.sh:/configure-schema-registry.sh:ro
    entrypoint:
    - /bin/sh
    - /configure-schema-registry.sh
    depends_on:
      schema-registry:
        condition: service_healthy
    restart: 'no'
    networks:
    - data-platform-network
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-kafka-ui
    profiles:
    - kafka-ui
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-}
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_CLUSTERS_0_READONLY: 'true'
      MCP_ENABLED: 'false'
      DYNAMIC_CONFIG_ENABLED: 'false'
    command:
    - /bin/sh
    - -ec
    - ': "$${SPRING_SECURITY_USER_NAME:?KAFKA_UI_USERNAME is required}"; : "$${SPRING_SECURITY_USER_PASSWORD:?KAFKA_UI_PASSWORD
      is required}"; exec java --add-opens java.rmi/javax.rmi.ssl=ALL-UNNAMED -jar /api.jar'
    ports:
    - 127.0.0.1:${KAFKA_UI_PORT:-8086}:8080
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network
  nessie:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-nessie
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      NESSIE_WAREHOUSE: ${NESSIE_WAREHOUSE:?NESSIE_WAREHOUSE is required}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
      WAREHOUSE_PREFIX: ${WAREHOUSE_PREFIX:?WAREHOUSE_PREFIX is required}
      WAREHOUSE_URI: ${WAREHOUSE_URI:?WAREHOUSE_URI is required}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?OBJECT_STORE_REGION is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:?S3_PATH_STYLE_ACCESS is required}
      NESSIE_S3_ACCESS_KEY: ${NESSIE_S3_ACCESS_KEY}
      NESSIE_S3_SECRET_KEY: ${NESSIE_S3_SECRET_KEY}
      NESSIE_S3_AUTH_TYPE: ${NESSIE_S3_AUTH_TYPE}
      NESSIE_S3_EXTERNAL_ENDPOINT: ${NESSIE_S3_EXTERNAL_ENDPOINT}
      NESSIE_SERVER_AUTHENTICATION_ENABLED: ${NESSIE_AUTHENTICATION_ENABLED:?NESSIE_AUTHENTICATION_ENABLED is required}
      QUARKUS_OIDC_AUTH_SERVER_URL: ${NESSIE_OIDC_ISSUER_URL:?NESSIE_OIDC_ISSUER_URL is required}
      QUARKUS_OIDC_CLIENT_ID: ${NESSIE_OIDC_CLIENT_ID:?NESSIE_OIDC_CLIENT_ID is required}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: ${NESSIE_WAREHOUSE:?NESSIE_WAREHOUSE is required}
      NESSIE_CATALOG_WAREHOUSES_PAYMENTS_LOCATION: ${WAREHOUSE_URI:?WAREHOUSE_URI is required}
      NESSIE_HTTPS_PORT: ${NESSIE_HTTPS_PORT:-19121}
      NESSIE_SSL_KEYSTORE_FILE: ${NESSIE_SSL_KEYSTORE_FILE:-/etc/nessie/certs/nessie.keystore.jks}
      NESSIE_SSL_KEYSTORE_PASSWORD: ${NESSIE_SSL_KEYSTORE_PASSWORD:-}
      NESSIE_SSL_TRUSTSTORE_FILE: ${NESSIE_SSL_TRUSTSTORE_FILE:-/etc/nessie/certs/nessie.truststore.jks}
      NESSIE_SSL_TRUSTSTORE_PASSWORD: ${NESSIE_SSL_TRUSTSTORE_PASSWORD:-}
    ports:
    - ${NESSIE_PORT:-19120}:19120
    - ${NESSIE_HTTPS_PORT:-19121}:19121
    volumes:
    - nessie-data:/var/lib/nessie
    - ${NESSIE_CERT_DIR:-/etc/nessie/certs}:/etc/nessie/certs:ro
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init-iam:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9000/q/health/ready >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
    - data-platform-network
  nessie-rest-proxy:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie-rest-proxy
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-nessie-rest-proxy
    profiles:
    - analytics
    - duckdb
    environment:
      NESSIE_UPSTREAM: ${NESSIE_ENDPOINT}
      PUBLIC_BASE: http://nessie-rest-proxy:19121
    depends_on:
      nessie:
        condition: service_healthy
    restart: unless-stopped
    networks:
    - data-platform-network
  payment-xml-generator:
    profiles:
    - generate-data
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-xml-generator
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-payment-xml-generator
    environment:
      DATA_ROOT: /app/data
      PYTHONUNBUFFERED: '1'
    volumes:
    - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
    command:
    - --count
    - ${PDM_GENERATOR_COUNT:-250}
  payment-producer:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-producer
    container_name: ${COMPOSE_PROJECT_NAME:-dp-pdm-ai-platform}-payment-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-PLAINTEXT://kafka:9092}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      SCHEMA_REGISTRY_AUTH_REQUIRED: ${SCHEMA_REGISTRY_AUTH_REQUIRED:-false}
      SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
      DATA_ROOT: /app/data
      PRODUCER_IDEMPOTENCE: 'true'
      PRODUCER_ACKS: all
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-}
      KAFKA_SSL_CERTIFICATE_LOCATION: ${KAFKA_SSL_CERTIFICATE_LOCATION:-}
      KAFKA_SSL_KEY_LOCATION: ${KAFKA_SSL_KEY_LOCATION:-}
      DP_SECRET_SOURCE: ${DP_SECRET_SOURCE:-}
      DP_SECRET_DIR: ${DP_SECRET_DIR:-}
    volumes:
    - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - data-platform-network
  payment-consumer-events:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-consumer-events
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_USE_SSL: ${S3_USE_SSL:?S3_USE_SSL is required}
      S3_CA_BUNDLE: ${S3_CA_BUNDLE}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?OBJECT_STORE_REGION is required}
      RAW_INGEST_S3_ACCESS_KEY_ID: ${RAW_INGEST_S3_ACCESS_KEY_ID:?RAW_INGEST_S3_ACCESS_KEY_ID is required}
      RAW_INGEST_S3_SECRET_ACCESS_KEY: ${RAW_INGEST_S3_SECRET_ACCESS_KEY:?RAW_INGEST_S3_SECRET_ACCESS_KEY is required}
      CDC_QUARANTINE_S3_ACCESS_KEY_ID: ${CDC_QUARANTINE_S3_ACCESS_KEY_ID:?CDC_QUARANTINE_S3_ACCESS_KEY_ID is required}
      CDC_QUARANTINE_S3_SECRET_ACCESS_KEY: ${CDC_QUARANTINE_S3_SECRET_ACCESS_KEY:?CDC_QUARANTINE_S3_SECRET_ACCESS_KEY is required}
      PLATFORM_RAW_READ_ACCESS_KEY: ${PLATFORM_RAW_READ_ACCESS_KEY:?PLATFORM_RAW_READ_ACCESS_KEY is required}
      PLATFORM_RAW_READ_SECRET_KEY: ${PLATFORM_RAW_READ_SECRET_KEY:?PLATFORM_RAW_READ_SECRET_KEY is required}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
      MINIO_BUCKET: ${OBJECT_STORE_BUCKET:?OBJECT_STORE_BUCKET is required}
      RAW_ROOT: ${RAW_ROOT:?RAW_ROOT is required}
      RAW_VERSION: ${RAW_VERSION:?RAW_VERSION is required}
      RAW_PREFIX: ${RAW_PREFIX:?RAW_PREFIX is required}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-PLAINTEXT://kafka:9092}
      KAFKA_GROUP_ID: payment-events-consumer
      KAFKA_RETRY_TOPIC: payment-events.retry
      KAFKA_DLQ_TOPIC: payment-events.dlq
      MAX_PROCESSING_RETRIES: ${MAX_PROCESSING_RETRIES:-3}
