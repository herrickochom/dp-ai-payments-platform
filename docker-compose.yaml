      TRINO_HOST: trino
      TRINO_PORT: '8080'
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      NESSIE_ENDPOINT: ${NESSIE_ENDPOINT}
      PDM_ML_SAMPLE_SIZE: ${PDM_ML_SAMPLE_SIZE:-100}
      PDM_ML_MODEL_DIR: /app/pdm-ml/models
    volumes:
    - ./services/pdm-ml:/app/pdm-ml
    - ./data:/app/data
    working_dir: /app/pdm-ml
    restart: 'no'
    networks:
    - data-platform-network
    depends_on:
      pdm-ml-features:
        condition: service_completed_successfully
    command:
    - python
    - scoring/score_default_risk.py
    - --model
    - /app/pdm-ml/models/pdm_default_risk_strict_early_warning_v1.joblib
    - --metadata
    - /app/pdm-ml/models/pdm_default_risk_strict_early_warning_v1_metadata.json
    - --input
    - /app/data/pdmis_ml/default_risk_current_scoring.jsonl
    - --output
    - /app/data/pdmis_ml/default_risk_current_predictions.jsonl
    - --summary
    - /app/data/pdmis_ml/default_risk_current_predictions_summary.json

  # ------------------------------------------------------------------
