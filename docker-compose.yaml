# ==============================================================================
# DP-AI Payments Platform - Docker Compose
# ==============================================================================
# All services organized by processing layers with profiles:
#   Default (no profile): Core services always start
#   analytics: BI and analytics tools
#   dev: Development services
#   on-demand: Services started only when needed
# ==============================================================================

networks:
  data-platform-network:
    name: ${DOCKER_NETWORK:-data-platform-network}
    driver: bridge

volumes:
  # Core
  pgdata:
  minio-data:
  nessie-data:
  kafka-data:
  kafka-metadata:
  redis-data:
  
  # Analytics
  trino-data:
  trino-logs:
  metabase-data:
  dbt-logs:
  superset-data:
  
  # Dev
  dev-logs:
  
  # Data volume for XML generator

services:

  # redis:
  #   image: redis:7-alpine
  #   container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-redis
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - data-platform-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  # ---------------------------------------------------------------------------
  # Redis
  # Shared caching, Celery broker/results, SQL Lab results and rate-limit store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ============================================================================
  # 1. DATA STORAGE LAYER (ALWAYS START)
  # ============================================================================

  postgres:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgresql
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-postgres
    environment:
      QUARKUS_CONFIG_LOCATIONS: /deployments/config/application.properties
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
      # Superset is created by 20_create_superset_db.sh; keep this list
      # disjoint so PostgreSQL initialization cannot abort on a duplicate.
      POSTGRES_MULTIPLE_DATABASES: metabase
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-healthcheck:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.postgres-healthcheck
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-postgres-healthcheck
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pdm_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["bash", "-c", "sleep 10 && /healthcheck.sh"]
    networks:
      - data-platform-network

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init-buckets:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-buckets
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-minio-init-buckets
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_PREFIX: raw/v2
      MINIO_ALIAS: "local"
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data-platform-network

  minio-init-databases:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.minio-init-mc-databases
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-minio-init-databases
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_ENDPOINT: "http://nessie:19120"
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data-platform-network

  # ============================================================================
  # 2. STREAMING LAYER (ALWAYS START)
  # ============================================================================

  # ---------------------------------------------------------------------------
  # KAFKA VOLUME OWNERSHIP INIT (one-shot)
  # ---------------------------------------------------------------------------
  # apache/kafka runs as appuser (uid 1000) and its entrypoint has no root
  # phase, while freshly created named volumes are root-owned. This one-shot
  # container fixes volume ownership so the broker can format and write its
  # metadata/log dirs (prevents AccessDeniedException on bootstrap.checkpoint).
  kafka-volume-init:
    image: apache/kafka:4.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-kafka-volume-init
    user: "0:0"
    entrypoint: ["bash", "-c", "chown -R 1000:1000 /var/lib/kafka/data /var/lib/kafka/metadata"]
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-metadata:/var/lib/kafka/metadata
    restart: "no"
    networks:
      - data-platform-network

  kafka:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-broker
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-kafka
    environment:
      CLUSTER_ID: "XwjubDNrR0q4Q6FLK0M7Xg"
      KAFKA_CLUSTER_ID: "XwjubDNrR0q4Q6FLK0M7Xg"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_METADATA_LOG_DIR: "/var/lib/kafka/metadata"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: "-Xmx512M"
      # Auto-create topics disabled - we'll create manually or via init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_ID: payment-events-consumer-v2
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-metadata:/var/lib/kafka/metadata
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      kafka-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 30
  
  # ---------------------------------------------------------------------------
  # KAFKA TOPIC INITIALIZATION
  # ---------------------------------------------------------------------------
  kafka-init:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.kafka-init
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
      TOPICS_CONFIG: "/app/topics.yaml"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"  # Run once and exit
    networks:
      - data-platform-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_LEADER_ELECTION_TYPE: static
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: "true"
      SCHEMA_REGISTRY_KAFKASTORE_GROUP_ID: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: "*"
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 60000
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 120000
      SCHEMA_REGISTRY_DEBUG: "true"
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # 3. CATALOG LAYER (ALWAYS START)
  # ============================================================================

  nessie:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-nessie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Nessie Iceberg REST catalog
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: payments
      NESSIE_CATALOG_WAREHOUSES_PAYMENTS_LOCATION: s3://dp-ai-payment/warehouse

      # MinIO / S3-compatible object store
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: eu-west-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: STATIC

      # Static credentials for Nessie via Quarkus secret resolution
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY: urn:nessie-secret:quarkus:minio
      MINIO_NAME: ${MINIO_ROOT_USER}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${NESSIE_PORT:-19120}:19120"
    volumes:
      - nessie-data:/var/lib/nessie
    depends_on:
      postgres-healthcheck:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:19120/api/v2/trees >/dev/null && curl -fsS 'http://localhost:19120/iceberg/v1/config?warehouse=payments' >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - data-platform-network

  # DuckDB currently emits Nessie's composite `main|warehouse` REST prefix
  # without percent-encoding it. This local proxy performs that URI-safe
  # translation; it stores no state and forwards to the Nessie catalog.
  nessie-rest-proxy:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.nessie-rest-proxy
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-nessie-rest-proxy
    profiles:
      - analytics
      - duckdb
    environment:
      NESSIE_UPSTREAM: http://nessie:19120
      PUBLIC_BASE: http://nessie-rest-proxy:19121
    depends_on:
      nessie:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data-platform-network

  # ============================================================================
  # 4. DATA PIPELINE LAYER (ALWAYS START)
  # ============================================================================

  payment-xml-generator:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-xml-generator
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-payment-xml-generator
    environment:
      DATA_ROOT: /app/data
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      postgres-healthcheck:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data-platform-network
    command: ["--count", "${PDM_GENERATOR_COUNT:-250}", "--clean"]

  payment-producer:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-producer
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-payment-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DATA_ROOT: /app/data
      PRODUCER_IDEMPOTENCE: "true"
      PRODUCER_ACKS: "all"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      payment-xml-generator:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data-platform-network

  payment-consumer-events:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.payment-consumer-events
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-payment-consumer-events
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_PREFIX: raw/v2
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_GROUP_ID: payment-events-consumer
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPICS: icmn.vpm.pain001,icmn.pmn.pain001,cpo.psn.pain002,cpo.plm.pain002,wendi.pain001,wendi.pain002,wendi.camt053,wendi.camt052,wendi.camt054,wendi.transactions,mobile.mtn.pacs008,mobile.mtn.pacs002,mobile.airtel.pacs008,mobile.airtel.pacs002,agent.transactions,agent.profiles,agent.locations,pdmis.beneficiaries,pdmis.loans,pdmis.repayments,pdmis.saccos,pdmis.households,pdmis.business_plans,pdmis.special_groups
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init-buckets:
        condition: service_completed_successfully
      payment-producer:
        condition: service_started
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      # dbt's staging models require at least one Avro object for every source.
      # Do not declare ingestion ready merely because the long-running consumer
      # process has started; it may still be draining the producer's backlog.
      test: ["CMD", "python3", "/app/raw_data_healthcheck.py"]
      interval: 5s
      timeout: 15s
      retries: 120
      start_period: 5s

  # ============================================================================
  # 5. ANALYTICS LAYER (PROFILE: analytics)
  # ============================================================================

  trino:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.trino-coordinator
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-trino
    user: "0:0"
    profiles:
      - analytics
      - trino
      - dbt
      - dashboard
      - superset
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768M"
      TRINO_CONFIG_DIR: /etc/trino
      TRINO_INTERNAL_SHARED_SECRET: ${TRINO_INTERNAL_SHARED_SECRET}
      TRINO_KEYSTORE_PASSWORD: ${TRINO_KEYSTORE_PASSWORD:-vbfma6z}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8089:8080"
      - "8443:8443"
    volumes:
      # Mount configuration files individually so the catalog directory copied
      # into the image remains available to Trino.
      - ./platform/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./platform/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./platform/trino/etc/event-listeners.json:/etc/trino/event-listeners.json:ro
      - ./platform/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./platform/trino/etc/log.properties:/etc/trino/log.properties:ro
      - ./platform/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./platform/trino/etc/password-auth.properties:/etc/trino/password-auth.properties:ro
      - ./platform/trino/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./platform/trino/etc/rules.json:/etc/trino/rules.json:ro
      - ./platform/trino/etc/password.db:/etc/trino/password.db:ro
      - ./platform/trino/etc/trino-keystore.jks:/etc/trino/trino-keystore.jks:ro
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.49.10
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-metabase
    profiles:
      - analytics
      - metabase
      - dashboard
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres

      MB_SITE_NAME: "PDM Analytics"
      MB_SITE_LOCALE: en
      MB_JETTY_PORT: "3000"
      JAVA_TIMEZONE: Africa/Kampala

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
    ports:
      - "${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase-data:/metabase-data
      - ./platform/trino/etc/trino-truststore.jks:/etc/metabase/trino-truststore.jks:ro
      - ./platform/metabase/plugins/starburst-4.1.0.metabase-driver.jar:/plugins/starburst-4.1.0.metabase-driver.jar:ro
    restart: unless-stopped
    networks:
      - data-platform-network
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Apache Superset 6.1 - modern BI / executive intelligence
  # ---------------------------------------------------------------------------
  # superset-init performs migrations, creates the initial administrator,
  # synchronises roles/permissions, and idempotently registers the Trino
  # connection after a clean metadata reset.
  #
  # The web server and worker start only after superset-init succeeds.
  # ---------------------------------------------------------------------------

  superset-init:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-superset-init
    profiles:
      - analytics
      - superset
      - dashboard
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"

      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-PDM}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Administrator}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@pdm.local}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption
      TRINO_DATABASE_NAME: ${TRINO_DATABASE_NAME:-PDM Trino}
      TRINO_SQLALCHEMY_URI: ${TRINO_SQLALCHEMY_URI:-trino://trino@trino:8080/iceberg/consumption}

    volumes:
      - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./platform/superset:/app/platform/superset:ro
      - superset-data:/app/superset_home

    restart: "no"

    networks:
      - data-platform-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        echo "Running Superset metadata migrations..."
        superset db upgrade

        echo "Creating initial administrator if required..."
        superset fab create-admin           --username "$${SUPERSET_ADMIN_USERNAME}"           --firstname "$${SUPERSET_ADMIN_FIRSTNAME}"           --lastname "$${SUPERSET_ADMIN_LASTNAME}"           --email "$${SUPERSET_ADMIN_EMAIL}"           --password "$${SUPERSET_ADMIN_PASSWORD}" || true

        echo "Synchronising Superset roles and permissions..."
        superset init

        echo "Registering/updating Trino database connection..."
        python - <<'PY'
        import os

        from superset.app import create_app

        app = create_app()

        with app.app_context():
            from superset import db
            from superset.models.core import Database

            database_name = os.getenv("TRINO_DATABASE_NAME", "PDM Trino")
            sqlalchemy_uri = os.getenv(
                "TRINO_SQLALCHEMY_URI",
                "trino://trino@trino:8080/iceberg/consumption",
            )

            database = (
                db.session.query(Database)
                .filter(Database.database_name == database_name)
                .first()
            )

            if database is None:
                database = Database(
                    database_name=database_name,
                    sqlalchemy_uri=sqlalchemy_uri,
                    expose_in_sqllab=True,
                    allow_ctas=False,
                    allow_cvas=False,
                    allow_dml=False,
                )
                db.session.add(database)
                action = "Created"
            else:
                database.sqlalchemy_uri = sqlalchemy_uri
                database.expose_in_sqllab = True
                database.allow_ctas = False
                database.allow_cvas = False
                database.allow_dml = False
                action = "Updated"

            db.session.commit()

            print(
                f"{action} Superset Trino connection: "
                f"id={database.id}, name={database.database_name}"
            )
        PY

        echo "Superset initialization completed successfully."

  superset:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-superset
    profiles:
      - analytics
      - superset
      - dashboard

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption

      SUPERSET_WEB_WORKERS: ${SUPERSET_WEB_WORKERS:-4}
      SUPERSET_WEB_THREADS: ${SUPERSET_WEB_THREADS:-4}
      SUPERSET_WEBSERVER_TIMEOUT: ${SUPERSET_WEBSERVER_TIMEOUT:-120}

    ports:
      - "${SUPERSET_PORT:-8088}:8088"

    volumes:
      - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./platform/superset:/app/platform/superset:ro
      - ./platform/superset/dashboards/Coat-of-arms-Uganda.webp:/app/superset/static/assets/images/Coat-of-arms-Uganda.webp:ro
      - superset-data:/app/superset_home

    restart: unless-stopped

    networks:
      - data-platform-network

    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        exec gunicorn           --bind 0.0.0.0:8088           --workers "$${SUPERSET_WEB_WORKERS}"           --worker-class gthread           --threads "$${SUPERSET_WEB_THREADS}"           --timeout "$${SUPERSET_WEBSERVER_TIMEOUT}"           --access-logfile -           --error-logfile -           "superset.app:create_app()"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8088/health >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  superset-worker:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.superset
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-superset-worker
    profiles:
      - analytics
      - superset
      - dashboard

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_METADATA_DB: superset

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_SCHEMA: consumption

      SUPERSET_CELERY_WORKERS: ${SUPERSET_CELERY_WORKERS:-2}

    volumes:
      - ./platform/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./platform/superset:/app/platform/superset:ro
      - superset-data:/app/superset_home

    restart: unless-stopped

    networks:
      - data-platform-network

    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        exec celery           --app=superset.tasks.celery_app:app           worker           -O fair           --loglevel=INFO           --concurrency="$${SUPERSET_CELERY_WORKERS}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME | grep -q pong"
        ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s

  dbt:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.dbt
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-dbt
    profiles:
      - analytics
      - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      TRINO_HOST: trino
      TRINO_PORT: 8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dp-ai-payment
      RAW_ROOT: raw/v2
      NESSIE_ENDPOINT: http://nessie:19120
    volumes:
      - ./transform/dbt:/usr/app/dbt
      - ./data:/app/data
      - dbt-logs:/usr/app/dbt/logs
      # DuckDB derives this default spill path from /tmp/pdm.duckdb. Mounting
      # it directly avoids reissuing SET temp_directory on every dbt connection.
      - ./tmp/duckdb:/tmp/pdm.duckdb.tmp
    restart: "no"
    networks:
      - data-platform-network
    # Both one-shot runners execute the same dbt project against the Nessie
    # catalog; without ordering they race and the loser fails with
    # "Table ... already exists". duckdb builds the lakehouse first (per the
    # README runbook), then dbt reruns the project sequentially.
    depends_on:
      trino:
        condition: service_healthy
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      duckdb:
        condition: service_completed_successfully

  # DuckDB is the dbt execution engine for Bronze Parquet.  It reads directly
  # from MinIO and writes managed Iceberg tables through Nessie's REST catalog.
  duckdb:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.duckdb
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-duckdb
    profiles:
      - analytics
      - duckdb
      - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: dp-ai-payment
      RAW_ROOT: raw/v2
      NESSIE_ENDPOINT: http://nessie:19120
    volumes:
      - ./transform/dbt:/usr/app/dbt
      - ./data:/app/data
      - dbt-logs:/usr/app/dbt/logs
      # DuckDB derives this default spill path from /tmp/pdm.duckdb. Mounting
      # it directly avoids reissuing SET temp_directory on every dbt connection.
      - ./tmp/duckdb:/tmp/pdm.duckdb.tmp
    restart: "no"
    networks:
      - data-platform-network
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy
      payment-consumer-events:
        condition: service_healthy
    command: ["build"]

  dbt-docs:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.dbt-docs
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-dbt-docs
    profiles:
      - analytics
      - dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      # profiles.yml resolves these via env_var() even when just parsing,
      # so docs serve fails without them.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NESSIE_ENDPOINT: http://nessie:19120
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - data-platform-network
    depends_on:
      dbt:
        condition: service_completed_successfully

  # ============================================================================
  # 6. DEVELOPMENT SERVICES (PROFILE: dev)
  # ============================================================================

  s3-landing-kafka-ingestion:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.s3-landing-kafka-ingestion
