# GCP source-side development stack; not a GCP production deployment.
# No cloud resources are created. CDC, publishing, generation and UI are opt-in.
# WARNING: payment-producer publishes events when explicitly invoked.
name: dp-ai-payments-platform-gcp
services:
  kafka-volume-init:
    image: apache/kafka:4.3.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-kafka-volume-init
    user: 0:0
    entrypoint:
      - bash
      - -c
      - chown -R 1000:1000 /var/lib/kafka/data /var/lib/kafka/metadata
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-metadata:/var/lib/kafka/metadata
    restart: 'no'
    networks:
      - data-platform-network
  kafka:
    build:
      context: .
      dockerfile: docker/kafka-broker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-kafka
    environment:
      CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_CLUSTER_ID: XwjubDNrR0q4Q6FLK0M7Xg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: '1'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/metadata
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_HEAP_OPTS: -Xmx512M
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - 127.0.0.1:${KAFKA_EXTERNAL_PORT:-9094}:9094
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-metadata:/var/lib/kafka/metadata
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - echo > /dev/tcp/localhost/9092
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    build:
      context: .
      dockerfile: docker/kafka-init/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
      TOPICS_CONFIG: /app/topics.yaml
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-}
      KAFKA_SSL_CERTIFICATE_LOCATION: ${KAFKA_SSL_CERTIFICATE_LOCATION:-}
      KAFKA_SSL_KEY_LOCATION: ${KAFKA_SSL_KEY_LOCATION:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    networks:
      - data-platform-network
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_LEADER_ELECTION_TYPE: static
      SCHEMA_REGISTRY_MASTER_ELIGIBILITY: 'true'
      SCHEMA_REGISTRY_KAFKASTORE_GROUP_ID: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
      SCHEMA_REGISTRY_ACCESS_CONTROL_ALLOW_METHODS: GET,POST,PUT,DELETE,OPTIONS
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 60000
      SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: 120000
      SCHEMA_REGISTRY_DEBUG: 'true'
    ports:
      - 127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data-platform-network
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8081/subjects || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  schema-registry-init:
    image: curlimages/curl:8.10.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-schema-registry-init
    environment:
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      SCHEMA_REGISTRY_AUTH_REQUIRED: ${SCHEMA_REGISTRY_AUTH_REQUIRED:-false}
      SCHEMA_REGISTRY_HTTPS_CA: ${SCHEMA_REGISTRY_HTTPS_CA:-}
      SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
      SCHEMA_COMPATIBILITY: BACKWARD_TRANSITIVE
    volumes:
      - ${SCHEMA_REGISTRY_CERT_DIR:-/etc/schema-registry/certs}:/etc/schema-registry/certs:ro
      - ./platform/kafka/configure-schema-registry.sh:/configure-schema-registry.sh:ro
      - ./contracts/kafka:/contracts/kafka:ro
    entrypoint:
      - /bin/sh
      - /configure-schema-registry.sh
    depends_on:
      schema-registry:
        condition: service_healthy
    restart: 'no'
    networks:
      - data-platform-network
  # Dedicated Debezium Kafka Connect worker. Explicitly opt-in; NO connector registration.
  # Existing compacted Connect state topics must be provisioned and verified beforehand.
  debezium:
    profiles:
      - cdc-connect
    image: quay.io/debezium/connect@sha256:f943f65cb6f46087902541fd3c9a448707039e1ee21d6111b801df4c9fff8703
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-debezium
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pdm-cdc-connect-dev
      CONFIG_STORAGE_TOPIC: _pdm_cdc_connect_configs
      OFFSET_STORAGE_TOPIC: _pdm_cdc_connect_offsets
      STATUS_STORAGE_TOPIC: _pdm_cdc_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      ADVERTISED_HOST_NAME: debezium
      REST_PORT: '8083'
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    ports:
      - 127.0.0.1:${DEBEZIUM_REST_PORT:-8083}:8083
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - data-platform-network
    restart: 'no'
    # Intentionally no credentials mount or connector registration.
    # Before activation, validate image startup env mapping and securely mount
    # a FileConfigProvider-readable credentials file at the connector template path.
  payment-xml-generator:
    profiles:
      - generate-data
    build:
      context: .
      dockerfile: docker/payment-xml-generator/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-payment-xml-generator
    environment:
      DATA_ROOT: /app/data
      PYTHONUNBUFFERED: '1'
    volumes:
      - ./data:/app/data
    depends_on: {}
    restart: 'no'
    networks:
      - data-platform-network
    command:
      - --count
      - ${PDM_GENERATOR_COUNT:-250}
  payment-producer:
    build:
      context: .
      dockerfile: docker/payment-producer/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-payment-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_REGISTRY_AUTH_REQUIRED: ${SCHEMA_REGISTRY_AUTH_REQUIRED:-false}
      SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO: ${SCHEMA_REGISTRY_BASIC_AUTH_USER_INFO:-}
      DATA_ROOT: /app/data
      PRODUCER_IDEMPOTENCE: 'true'
      PRODUCER_ACKS: all
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_SSL_CA_LOCATION: ${KAFKA_SSL_CA_LOCATION:-}
      KAFKA_SSL_CERTIFICATE_LOCATION: ${KAFKA_SSL_CERTIFICATE_LOCATION:-}
      KAFKA_SSL_KEY_LOCATION: ${KAFKA_SSL_KEY_LOCATION:-}
      DP_SECRET_SOURCE: ${DP_SECRET_SOURCE:-}
      DP_SECRET_DIR: ${DP_SECRET_DIR:-}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
    restart: 'no'
    networks:
      - data-platform-network
    profiles:
      - publish-data
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-kafka-ui
    profiles:
      - kafka-ui
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-}
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_CLUSTERS_0_READONLY: 'true'
      MCP_ENABLED: 'false'
      DYNAMIC_CONFIG_ENABLED: 'false'
    command:
      - /bin/sh
      - -ec
      - >-
        : "$${SPRING_SECURITY_USER_NAME:?KAFKA_UI_USERNAME is required}";
        : "$${SPRING_SECURITY_USER_PASSWORD:?KAFKA_UI_PASSWORD is required}";
        exec java --add-opens java.rmi/javax.rmi.ssl=ALL-UNNAMED -jar /api.jar
    ports:
      - 127.0.0.1:${KAFKA_UI_PORT:-8086}:8080
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data-platform-network
  # ==========================================================================
  # MDM: Cloud SQL golden records (profile: mdm)
  # ==========================================================================
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-cloud-sql-proxy
    profiles:
      - mdm
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--auto-iam-authn"
      - "${CLOUD_SQL_CONNECTION_NAME:-project-e48f194e-f44f-458d-b4f:europe-west2:pdm-dev-mdm-postgres}"
    volumes:
      - ./certs:/certs:ro
    restart: 'no'
    networks:
      - data-platform-network
  mdm-loader:
    profiles:
      - mdm
    build:
      context: .
      dockerfile: docker/mdm-loader/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-mdm-loader
    environment:
      DATA_ROOT: /app/data
      PDM_MDM_TARGET: cloudsql
      PDM_MDM_FULL_REPLACE_APPROVED: I_APPROVE_FULL_MDM_REPLACEMENT
      PDM_SOURCE_HOST: cloud-sql-proxy
      PDM_SOURCE_DB_PORT: "5432"
      PDM_SOURCE_DB: ${PDM_SOURCE_DB:-pdm_mdm}
      PDM_SOURCE_USER: ${PDM_SOURCE_USER}
      PDM_SOURCE_PASSWORD: ${PDM_SOURCE_PASSWORD}
      PDM_SOURCE_SSLMODE: verify-ca
      PDM_SOURCE_SSLROOTCERT: /certs/google-cloudsql-server-ca.crt
      PDM_SOURCE_CONNECT_TIMEOUT: "10"
      PDM_SOURCE_STATEMENT_TIMEOUT_MS: "60000"
    volumes:
      - ./data:/app/data:ro
      - ./certs:/certs:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_started
    restart: 'no'
    networks:
      - data-platform-network
  mdm-publisher:
    profiles:
      - mdm
    build:
      context: .
      dockerfile: docker/mdm-publisher/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform-gcp}-mdm-publisher
    environment:
      PDM_MDM_TARGET: cloudsql
      PDM_SOURCE_HOST: cloud-sql-proxy
      PDM_SOURCE_DB_PORT: "5432"
      PDM_SOURCE_DB: ${PDM_SOURCE_DB:-pdm_mdm}
      PDM_SOURCE_USER: ${PDM_SOURCE_USER}
      PDM_SOURCE_PASSWORD: ${PDM_SOURCE_PASSWORD}
      PDM_SOURCE_SSLMODE: verify-ca
      PDM_SOURCE_SSLROOTCERT: /certs/google-cloudsql-server-ca.crt
      PDM_SOURCE_CONNECT_TIMEOUT: "10"
      PDM_SOURCE_STATEMENT_TIMEOUT_MS: "60000"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      DP_SECRET_SOURCE: ${DP_SECRET_SOURCE:-}
      DP_SECRET_DIR: ${DP_SECRET_DIR:-}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: 'no'
    networks:
      - data-platform-network

networks:
  data-platform-network:
    external: true
    name: ${DOCKER_NETWORK:-data-platform-network}
volumes:
  kafka-data:
    external: true
    name: dp-pdm-gcp-source-dev_kafka-data
  kafka-metadata:
    external: true
    name: dp-pdm-gcp-source-dev_kafka-metadata
