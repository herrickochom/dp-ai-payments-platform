      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.python-transform
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-python-transform
    profiles:
      - dev
      - transform
    environment:
      MINIO_ENDPOINT: http://minio:9000
      NESSIE_ENDPOINT: http://nessie:19120
      TRINO_HOST: trino
      TRINO_PORT: 8080
    volumes:
      - ./services/agents/modeling:/app/src
    restart: unless-stopped
    networks:
      - data-platform-network
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_healthy

  python-api:
    build:
      context: .
      dockerfile: platform/docker/dockerfiles/Dockerfile.python-api
    container_name: ${COMPOSE_PROJECT_NAME:-dp-ai-payments-platform}-python-api
    profiles:
